<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Survival To-Do</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --background: #090b0f;
            --panel: #11151c;
            --panel-hover: #171c24;
            --border: #252c36;
            --text: #f2f4f7;
            --muted: #9aa4b2;
            --accent: #5bd66f;
            --accent-dark: #3fa94f;
            --danger: #ff7777;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        header {
            padding: 40px 20px 30px;
            border-bottom: 1px solid var(--border);
            background:
                linear-gradient(
                    180deg,
                    #10151b 0%,
                    var(--background) 100%
                );
        }

        .header-inner,
        main {
            width: min(1000px, 100%);
            margin: auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(30px, 6vw, 52px);
            letter-spacing: -1.5px;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
        }

        .world-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .world-selector {
            flex: 1;
            min-width: 220px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--panel);
            color: var(--text);
            font-size: 15px;
        }

        .world-selector:focus {
            border-color: var(--accent-dark);
        }

        .world-name {
            margin-top: 20px;
            color: var(--muted);
            font-size: 14px;
        }

        .world-name strong {
            color: var(--text);
        }

        .progress-area {
            margin-top: 22px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 9px;
            color: var(--muted);
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #1d232c;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--accent);
            transition: width 0.25s ease;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px;
        }

        .search {
            flex: 1;
            min-width: 220px;
            padding: 13px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--panel);
            color: var(--text);
            font-size: 15px;
        }

        .search:focus {
            border-color: var(--accent-dark);
        }

        button {
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: var(--panel-hover);
        }

        .new-world {
            background: var(--accent);
            color: #071009;
            border-color: var(--accent);
            font-weight: 700;
        }

        .new-world:hover {
            background: #70e881;
        }

        .rename {
            color: #b7d5ff;
        }

        .reset {
            color: #ffb0b0;
        }

        .delete {
            color: var(--danger);
        }

        main {
            padding: 30px 20px 60px;
        }

        .world-manager {
            margin-bottom: 35px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .world-manager-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 15px;
        }

        .world-manager h2 {
            margin: 0;
            font-size: 21px;
        }

        .world-limit {
            color: var(--muted);
            font-size: 13px;
        }

        .world-list {
            display: grid;
            gap: 9px;
        }

        .world-card {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #0d1117;
        }

        .world-card.current {
            border-color: var(--accent-dark);
        }

        .world-card-info {
            min-width: 0;
        }

        .world-card-name {
            margin-bottom: 5px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .world-card-progress {
            color: var(--muted);
            font-size: 13px;
        }

        .world-card-bar {
            width: 100%;
            height: 6px;
            margin-top: 9px;
            background: #202631;
            border-radius: 999px;
            overflow: hidden;
        }

        .world-card-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
        }

        .world-card-actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .empty-worlds {
            padding: 25px 10px;
            color: var(--muted);
            text-align: center;
        }

        section {
            margin-bottom: 38px;
        }

        .section-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 14px;
        }

        h2 {
            margin: 0;
            font-size: 23px;
        }

        .section-count {
            color: var(--muted);
            font-size: 13px;
            white-space: nowrap;
        }

        .todo-list {
            display: grid;
            gap: 7px;
        }

        .todo {
            display: flex;
            align-items: center;
            gap: 13px;
            min-height: 52px;
            padding: 12px 15px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .todo:hover {
            background: var(--panel-hover);
        }

        .todo input {
            width: 19px;
            height: 19px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
            flex-shrink: 0;
        }

        .todo span {
            font-size: 15px;
            line-height: 1.4;
        }

        .todo.completed span {
            color: var(--muted);
            text-decoration: line-through;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            display: none;
            padding: 35px 15px;
            text-align: center;
            color: var(--muted);
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 650px) {
            header {
                padding-top: 30px;
            }

            main {
                padding-left: 14px;
                padding-right: 14px;
            }

            .world-card {
                grid-template-columns: 1fr;
            }

            .world-card-actions {
                justify-content: flex-start;
            }

            .todo {
                padding: 11px 12px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>

        <div class="world-name">

        <div class="progress-area">

                </span>

            </div>

            <div class="progress-bar">

            </div>

        </div>

        <div class="controls">

            <input

            >

            <button
                type="button"

            >

        </div>

    </div>

<footer>
    Minecraft Survival To-Do
</footer>


<script>
    const STORAGE_KEY =
        "minecraft-survival-todo-worlds";

    const MAX_WORLDS = 100;

    let worlds = {};
    let currentWorldId = null;


    const checkboxes =
        document.querySelectorAll(
            'input[type="checkbox"][data-id]'
        );

    const worldSelector =
        document.getElementById(
            "worldSelector"
        );

    const worldList =
        document.getElementById(
            "worldList"
        );

    const worldLimit =
        document.getElementById(
            "worldLimit"
        );

    const currentWorldName =
        document.getElementById(
            "currentWorldName"
        );

    const newWorldButton =
        document.getElementById(
            "newWorldButton"
        );

    const search =
        document.getElementById(
            "search"
        );

    const progressText =
        document.getElementById(
            "progressText"
        );

    const progressPercent =
        document.getElementById(
            "progressPercent"
        );

    const progressFill =
        document.getElementById(
            "progressFill"
        );

    const resetButton =
        document.getElementById(
            "resetButton"
        );

    const empty =
        document.getElementById(
            "empty"
        );


    function loadWorlds() {

        try {

            const saved =
                localStorage.getItem(
                    STORAGE_KEY
                );

            if (saved) {
                worlds = JSON.parse(saved);
            }

        } catch {

            worlds = {};

        }


        if (
            !worlds ||
            typeof worlds !== "object" ||
            Array.isArray(worlds)
        ) {
            worlds = {};
        }


        const ids =
            Object.keys(worlds);


        if (
            ids.length > 0
        ) {

            currentWorldId =
                localStorage.getItem(
                    STORAGE_KEY + "-current"
                );

            if (
                !currentWorldId ||
                !worlds[currentWorldId]
            ) {
                currentWorldId = ids[0];
            }

        } else {

            createWorld(
                "World 1",
                false
            );

        }

        saveWorlds();
        renderWorlds();
        loadCurrentWorld();

    }


    function saveWorlds() {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(worlds)
        );

        if (currentWorldId) {

            localStorage.setItem(
                STORAGE_KEY + "-current",
                currentWorldId
            );

        }

    }


    function createWorld(
        name,
        shouldSave = true
    ) {

        const worldCount =
            Object.keys(worlds).length;


        if (
            worldCount >= MAX_WORLDS
        ) {

            alert(
                "You can have up to 100 worlds."
            );

            return;

        }


        const id =
            "world-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2, 8);


        worlds[id] = {

            name: name,

            progress: {}

        };


        currentWorldId = id;


        if (shouldSave) {
            saveWorlds();
        }

        renderWorlds();
        loadCurrentWorld();

    }


    function getWorldProgress(
        world
    ) {

        let completed = 0;

        checkboxes.forEach(
            checkbox => {

                if (
                    world.progress[
                        checkbox.dataset.id
                    ] === true
                ) {

                    completed++;

                }

            }
        );


        const total =
            checkboxes.length;


        const percentage =
            total === 0
                ? 0
                : Math.round(
                    (completed / total) * 100
                );


        return {
            completed,
            total,
            percentage
        };

    }


    function renderWorlds() {

        const ids =
            Object.keys(worlds);


        worldLimit.textContent =
            `${ids.length} / ${MAX_WORLDS} worlds`;


        worldSelector.innerHTML = "";


        ids.forEach(
            id => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value = id;

                option.textContent =
                    worlds[id].name;

                option.selected =
                    id === currentWorldId;

                worldSelector.appendChild(
                    option
                );

            }
        );


        worldList.innerHTML = "";


        if (
            ids.length === 0
        ) {

            const message =
                document.createElement(
                    "div"
                );

            message.className =
                "empty-worlds";

            message.textContent =
                "No worlds yet.";

            worldList.appendChild(
                message
            );

            return;

        }


        ids.forEach(
            id => {

                const world =
                    worlds[id];

                const stats =
                    getWorldProgress(
                        world
                    );


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "world-card";


                if (
                    id === currentWorldId
                ) {

                    card.classList.add(
                        "current"
                    );

                }


                const info =
                    document.createElement(
                        "div"
                    );

                info.className =
                    "world-card-info";


                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "world-card-name";

                name.textContent =
                    world.name;


                const progress =
                    document.createElement(
                        "div"
                    );

                progress.className =
                    "world-card-progress";

                progress.textContent =
                    `${stats.completed} / ${stats.total} completed — ${stats.percentage}%`;


                const bar =
                    document.createElement(
                        "div"
                    );

                bar.className =
                    "world-card-bar";


                const fill =
                    document.createElement(
                        "div"
                    );

                fill.className =
                    "world-card-fill";

                fill.style.width =
                    `${stats.percentage}%`;


                bar.appendChild(
                    fill
                );


                info.appendChild(
                    name
                );

                info.appendChild(
                    progress
                );

                info.appendChild(
                    bar
                );


                const actions =
                    document.createElement(
                        "div"
                    );

                actions.className =
                    "world-card-actions";


                const openButton =
                    document.createElement(
                        "button"
                    );

                openButton.textContent =
                    "Open";

                openButton.addEventListener(
                    "click",
                    () => {
                        switchWorld(id);
                    }
                );


                const renameButton =
                    document.createElement(
                        "button"
                    );

                renameButton.textContent =
                    "Rename";

                renameButton.className =
                    "rename";

                renameButton.addEventListener(
                    "click",
                    () => {
                        renameWorld(id);
                    }
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.textContent =
                    "Delete";

                deleteButton.className =
                    "delete";

                deleteButton.addEventListener(
                    "click",
                    () => {
                        deleteWorld(id);
                    }
                );


                actions.appendChild(
                    openButton
                );

                actions.appendChild(
                    renameButton
                );

                actions.appendChild(
                    deleteButton
                );


                card.appendChild(
                    info
                );

                card.appendChild(
                    actions
                );


                worldList.appendChild(
                    card
                );

            }
        );

    }


    function switchWorld(
        id
    ) {

        if (
            !worlds[id]
        ) {
            return;
        }


        currentWorldId =
            id;


        saveWorlds();
        renderWorlds();
        loadCurrentWorld();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function loadCurrentWorld() {

        const world =
            worlds[currentWorldId];


        if (!world) {
            return;
        }


        currentWorldName.textContent =
            world.name;


        checkboxes.forEach(
            checkbox => {

                checkbox.checked =
                    world.progress[
                        checkbox.dataset.id
                    ] === true;


                updateTodoAppearance(
                    checkbox
                );

            }
        );


        search.value = "";

        updateProgress();
        filterTasks();

    }


    function saveCurrentWorld() {

        const world =
            worlds[currentWorldId];


        if (!world) {
            return;
        }


        checkboxes.forEach(
            checkbox => {

                world.progress[
                    checkbox.dataset.id
                ] =
                    checkbox.checked;

            }
        );


        saveWorlds();
        renderWorlds();

    }


    function renameWorld(
        id
    ) {

        const world =
            worlds[id];


        if (!world) {
            return;
        }


        const newName =
            prompt(
                "Enter a new world name:",
                world.name
            );


        if (
            newName === null
        ) {
            return;
        }


        const trimmed =
            newName.trim();


        if (
            !trimmed
        ) {

            alert(
                "World name cannot be empty."
            );

            return;

        }


        world.name =
            trimmed;


        saveWorlds();
        renderWorlds();


        if (
            id === currentWorldId
        ) {

            currentWorldName.textContent =
                trimmed;

        }

    }


    function deleteWorld(
        id
    ) {

        const world =
            worlds[id];


        if (!world) {
            return;
        }


        const confirmed =
            confirm(
                `Delete "${world.name}"?\n\nAll checklist progress for this world will be permanently removed.`
            );


        if (!confirmed) {
            return;
        }


        delete worlds[id];


        const remaining =
            Object.keys(worlds);


        if (
            remaining.length === 0
        ) {

            createWorld(
                "World 1"
            );

            return;

        }


        if (
            id === currentWorldId
        ) {

            currentWorldId =
                remaining[0];

        }


        saveWorlds();
        renderWorlds();
        loadCurrentWorld();

    }


    function updateTodoAppearance(
        checkbox
    ) {

        const todo =
            checkbox.closest(
                ".todo"
            );


        if (!todo) {
            return;
        }


        todo.classList.toggle(
            "completed",
            checkbox.checked
        );

    }


    function updateProgress() {

        const total =
            checkboxes.length;

        let completed = 0;


        checkboxes.forEach(
            checkbox => {

                if (
                    checkbox.checked
                ) {
                    completed++;
                }

            }
        );


        const percentage =
            total === 0
                ? 0
                : Math.round(
                    (completed / total) * 100
                );


        progressText.textContent =
            `${completed} / ${total} completed`;

        progressPercent.textContent =
            `${percentage}%`;

        progressFill.style.width =
            `${percentage}%`;


        updateSectionCounts();

    }


    function updateSectionCounts() {

        document
            .querySelectorAll(
                "section"
            )
            .forEach(
                section => {

                    const boxes =
                        section.querySelectorAll(
                            'input[type="checkbox"]'
                        );


                    const completed =
                        section.querySelectorAll(
                            'input[type="checkbox"]:checked'
                        ).length;


                    const count =
                        section.querySelector(
                            ".section-count"
                        );


                    if (count) {

                        count.textContent =
                            `${completed} / ${boxes.length}`;

                    }

                }
            );

    }


    function filterTasks() {

        const query =
            search.value
                .trim()
                .toLowerCase();


        let visibleTasks = 0;


        document
            .querySelectorAll(
                ".todo"
            )
            .forEach(
                todo => {

                    const text =
                        todo.textContent
                            .trim()
                            .toLowerCase();


                    const matches =
                        text.includes(
                            query
                        );


                    todo.classList.toggle(
                        "hidden",
                        !matches
                    );


                    if (matches) {
                        visibleTasks++;
                    }

                }
            );


        document
            .querySelectorAll(
                "section"
            )
            .forEach(
                section => {

                    const visible =
                        section.querySelectorAll(
                            ".todo:not(.hidden)"
                        ).length;


                    section.classList.toggle(
                        "hidden",
                        visible === 0
                    );

                }
            );


        empty.style.display =
            visibleTasks === 0
                ? "block"
                : "none";

    }


    checkboxes.forEach(
        checkbox => {

            checkbox.addEventListener(
                "change",
                () => {

                    updateTodoAppearance(
                        checkbox
                    );

                    saveCurrentWorld();
                    updateProgress();

                }
            );

        }
    );


    worldSelector.addEventListener(
        "change",
        () => {

            switchWorld(
                worldSelector.value
            );

        }
    );


    newWorldButton.addEventListener(
        "click",
        () => {

            const worldCount =
                Object.keys(worlds).length;


            if (
                worldCount >= MAX_WORLDS
            ) {

                alert(
                    "You have reached the maximum of 100 worlds."
                );

                return;

            }


            const defaultName =
                `World ${worldCount + 1}`;


            const name =
                prompt(
                    "Enter a name for the new world:",
                    defaultName
                );


            if (
                name === null
            ) {
                return;
            }


            const trimmed =
                name.trim();


            if (
                !trimmed
            ) {

                alert(
                    "World name cannot be empty."
                );

                return;

            }


            createWorld(
                trimmed
            );

        }
    );


    search.addEventListener(
        "input",
        filterTasks
    );


    resetButton.addEventListener(
        "click",
        () => {

            const world =
                worlds[currentWorldId];


            if (!world) {
                return;
            }


            const confirmed =
                confirm(
                    `Reset all checklist progress for "${world.name}"?`
                );


            if (!confirmed) {
                return;
            }


            checkboxes.forEach(
                checkbox => {

                    checkbox.checked =
                        false;


                    updateTodoAppearance(
                        checkbox
                    );

                }
            );


            saveCurrentWorld();
            updateProgress();
            filterTasks();

        }
    );


    loadWorlds();

</script>
