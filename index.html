<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Versions</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #090b10;
            color: #ffffff;
        }

        body {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 36px;
        }

        .description {
            margin: 0 0 30px;
            color: #9da4b3;
        }

        .latest {
            display: block;
            padding: 18px 20px;
            margin-bottom: 30px;

            background: #4f46e5;
            color: white;

            text-decoration: none;
            text-align: center;

            border-radius: 12px;

            font-size: 18px;
            font-weight: bold;

            transition: 0.2s;
        }

        .latest:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        .versions {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(140px, 1fr)
                );

            gap: 12px;
        }

        .version {
            display: block;

            padding: 16px;

            background: #11151d;
            border: 1px solid #202633;

            color: white;
            text-decoration: none;

            border-radius: 10px;

            text-align: center;

            transition: 0.2s;
        }

        .version:hover {
            background: #181e29;
            border-color: #4f46e5;
            transform: translateY(-2px);
        }

        .version-number {
            font-size: 18px;
            font-weight: bold;
        }

        .version-path {
            margin-top: 5px;

            color: #8b93a3;

            font-size: 13px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Versions</h1>

        <p class="description">
            Choose the version you want to use.
        </p>

        <a
            id="latest"
            class="latest"
        ></a>

        <div
            id="versions"
            class="versions"
        ></div>

    </main>

    <script>
        /*
            Change ONLY this number
        */

        const versionCount = 2;


        /*
            Latest version
        */

        const latestVersion =
            versionCount;


        /*
            Latest button
        */

        const latest =
            document.getElementById(
                "latest"
            );

        latest.href =
            "/v" +
            latestVersion;

        latest.textContent =
            "Latest Version — v" +
            latestVersion;


        /*
            Version links
        */

        const versions =
            document.getElementById(
                "versions"
            );


        for (
            let version = 1;
            version <= versionCount;
            version++
        ) {

            const link =
                document.createElement(
                    "a"
                );

            link.className =
                "version";

            link.href =
                "/v" +
                version;


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "version-number";

            number.textContent =
                "v" +
                version;


            const path =
                document.createElement(
                    "div"
                );

            path.className =
                "version-path";

            path.textContent =
                "/v" +
                version;


            link.appendChild(
                number
            );

            link.appendChild(
                path
            );

            versions.appendChild(
                link
            );
        }
    </script>

</body>
</html>
