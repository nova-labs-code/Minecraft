<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Survival To-Do</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #090b10;
            --panel: #11151d;
            --panel-2: #171c25;
            --border: #272e3a;
            --text: #f1f3f5;
            --muted: #929aa8;
            --accent: #5b8cff;
            --accent-hover: #4a7bea;
            --danger: #e05252;
            --danger-hover: #c94141;
            --success: #55b879;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
        }

        body {
            padding: 20px;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 28px;
            line-height: 1.2;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toolbar input {
            flex: 1 1 250px;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--panel);
            color: var(--text);
        }

        .toolbar input:focus {
            border-color: var(--accent);
        }

        .toolbar input::placeholder {
            color: var(--muted);
        }

        .button {
            padding: 11px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            transition:
                background 0.15s ease,
                border-color 0.15s ease;
        }

        .button:hover {
            border-color: #394354;
        }

        .button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .button.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .button.danger {
            color: #ff8585;
        }

        .button.danger:hover {
            background: var(--danger-hover);
            border-color: var(--danger-hover);
            color: white;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        .world-panel {
            padding: 16px;
            margin-bottom: 20px;
        }

        .world-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .world-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .world-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .world-list {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }

        .world-card {
            padding: 14px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .world-card.current {
            border-color: var(--accent);
        }

        .world-card-title {
            margin-bottom: 5px;
            font-weight: 600;
            word-break: break-word;
        }

        .world-card-status {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 12px;
        }

        .world-card-progress {
            height: 6px;
            margin-bottom: 10px;
            overflow: hidden;
            background: #242a34;
            border-radius: 999px;
        }

        .world-card-progress-fill {
            width: 0%;
            height: 100%;
            background: var(--success);
            transition: width 0.2s ease;
        }

        .world-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .small-button {
            padding: 7px 9px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #1b212b;
            color: var(--text);
            font-size: 12px;
        }

        .small-button:hover {
            border-color: #394354;
        }

        .small-button.danger {
            color: #ff8585;
        }

        .progress-panel {
            padding: 16px;
            margin-bottom: 20px;
        }

        .progress-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .current-world-name {
            font-size: 18px;
            font-weight: 600;
        }

        .progress-text {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            overflow: hidden;
            background: #242a34;
            border-radius: 999px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--success);
            transition: width 0.2s ease;
        }

        #checklist {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section {
            overflow: hidden;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--panel-2);
        }

        .section-title {
            margin: 0;
            font-size: 17px;
        }

        .section-count {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .task-list {
            display: flex;
            flex-direction: column;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
        }

        .task:last-child {
            border-bottom: none;
        }

        .task:hover {
            background: #141923;
        }

        .task input[type="checkbox"] {
            flex: 0 0 auto;
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .task-label {
            flex: 1;
            min-width: 0;
            color: var(--text);
            font-size: 14px;
            line-height: 1.4;
            cursor: pointer;
            word-break: break-word;
        }

        .task.completed .task-label {
            color: var(--muted);
            text-decoration: line-through;
        }

        .empty-state {
            padding: 30px 20px;
            color: var(--muted);
            text-align: center;
        }

        .error {
            padding: 15px;
            border: 1px solid #713535;
            border-radius: 8px;
            background: #251416;
            color: #ff9b9b;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .world-header,
            .progress-top {
                align-items: flex-start;
                flex-direction: column;
            }

            .progress-text {
                white-space: normal;
            }

            .world-list {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar input,
            .toolbar .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Minecraft Survival To-Do</h1>

        <p class="subtitle">
            Track your survival progress across multiple worlds.
        </p>
    </header>

    <div class="toolbar">

        <input
            id="searchInput"
            type="search"
            placeholder="Search checklist..."
            autocomplete="off"
        >

        <button
            id="newWorldButton"
            class="button primary"
            type="button"
        >
            New World
        </button>

        <button
            id="resetWorldButton"
            class="button danger"
            type="button"
        >
            Reset Current World
        </button>

    </div>

    <section class="world-panel panel">

        <div class="world-header">

            <h2>Worlds</h2>

            <div class="world-actions">

                <button
                    id="renameWorldButton"
                    class="button"
                    type="button"
                >
                    Rename World
                </button>

            </div>

        </div>

        <div
            id="worldList"
            class="world-list"
        ></div>

    </section>

    <section class="progress-panel panel">

        <div class="progress-top">

            <div
                id="currentWorldName"
                class="current-world-name"
            >
                Loading...
            </div>

            <div
                id="progressText"
                class="progress-text"
            >
                0 / 0 completed
            </div>

        </div>

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>

    </section>

    <main id="checklist"></main>

</div>

<script>
    const WORLDS_STORAGE_KEY =
        "minecraft-survival-todo-worlds";

    const CURRENT_WORLD_STORAGE_KEY =
        "minecraft-survival-todo-worlds-current";

    const MAX_WORLDS = 100;

    const CHECKLIST_URL =
        "./checklist.json";

    const JSON_CHECK_INTERVAL = 2000;

    let checklist = {};

    let worlds = {};

    let currentWorldId = null;

    let checklistSignature = "";

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const newWorldButton =
        document.getElementById(
            "newWorldButton"
        );

    const resetWorldButton =
        document.getElementById(
            "resetWorldButton"
        );

    const renameWorldButton =
        document.getElementById(
            "renameWorldButton"
        );

    const worldList =
        document.getElementById(
            "worldList"
        );

    const currentWorldName =
        document.getElementById(
            "currentWorldName"
        );

    const progressText =
        document.getElementById(
            "progressText"
        );

    const progressFill =
        document.getElementById(
            "progressFill"
        );

    const checklistElement =
        document.getElementById(
            "checklist"
        );


    function saveWorlds() {

        localStorage.setItem(
            WORLDS_STORAGE_KEY,
            JSON.stringify(worlds)
        );

        localStorage.setItem(
            CURRENT_WORLD_STORAGE_KEY,
            currentWorldId
        );
    }


    function loadWorlds() {

        try {

            const saved =
                localStorage.getItem(
                    WORLDS_STORAGE_KEY
                );

            if (saved) {

                worlds =
                    JSON.parse(saved);

            }

        } catch (error) {

            worlds = {};

        }

        const savedCurrentWorld =
            localStorage.getItem(
                CURRENT_WORLD_STORAGE_KEY
            );

        if (
            savedCurrentWorld &&
            worlds[savedCurrentWorld]
        ) {

            currentWorldId =
                savedCurrentWorld;

        }

        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            const worldIds =
                Object.keys(worlds);

            if (worldIds.length > 0) {

                currentWorldId =
                    worldIds[0];

            } else {

                createInitialWorld();

            }

        }

        saveWorlds();
    }


    function createInitialWorld() {

        const id =
            createWorldId();

        worlds[id] = {

            id: id,

            name: "World 1",

            progress: {}

        };

        currentWorldId = id;
    }


    function createWorldId() {

        return (
            "world-" +
            Date.now() +
            "-" +
            Math.random()
                .toString(36)
                .slice(2, 9)
        );
    }


    function getWorldCount() {

        return Object.keys(worlds).length;
    }


    function createNewWorld() {

        if (
            getWorldCount() >=
            MAX_WORLDS
        ) {

            alert(
                "You can have up to 100 worlds."
            );

            return;
        }

        const worldNumber =
            getNextWorldNumber();

        const name =
            prompt(
                "Enter a name for the new world:",
                "World " + worldNumber
            );

        if (
            name === null
        ) {

            return;

        }

        const trimmedName =
            name.trim();

        const finalName =
            trimmedName ||
            "World " + worldNumber;

        const id =
            createWorldId();

        worlds[id] = {

            id: id,

            name: finalName,

            progress: {}

        };

        currentWorldId = id;

        saveWorlds();

        renderWorlds();

        renderChecklist();

        updateProgress();
    }


    function getNextWorldNumber() {

        const numbers = [];

        for (
            const world of Object.values(worlds)
        ) {

            const match =
                world.name.match(
                    /^World (\d+)$/
                );

            if (match) {

                numbers.push(
                    Number(match[1])
                );

            }

        }

        let number = 1;

        while (
            numbers.includes(number)
        ) {

            number++;

        }

        return number;
    }


    function renameCurrentWorld() {

        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            return;
        }

        const world =
            worlds[currentWorldId];

        const name =
            prompt(
                "Enter a new name for this world:",
                world.name
            );

        if (
            name === null
        ) {

            return;
        }

        const trimmedName =
            name.trim();

        if (!trimmedName) {

            return;
        }

        world.name =
            trimmedName;

        saveWorlds();

        renderWorlds();

        updateProgress();
    }


    function deleteWorld(
        worldId
    ) {

        if (
            !worlds[worldId]
        ) {

            return;
        }

        const world =
            worlds[worldId];

        const confirmed =
            confirm(
                'Delete "' +
                world.name +
                '"? This cannot be undone.'
            );

        if (!confirmed) {

            return;
        }

        delete worlds[worldId];

        const remainingIds =
            Object.keys(worlds);

        if (
            remainingIds.length === 0
        ) {

            createInitialWorld();

        } else if (
            currentWorldId === worldId
        ) {

            currentWorldId =
                remainingIds[0];

        }

        saveWorlds();

        renderWorlds();

        renderChecklist();

        updateProgress();
    }


    function selectWorld(
        worldId
    ) {

        if (
            !worlds[worldId]
        ) {

            return;
        }

        currentWorldId =
            worldId;

        saveWorlds();

        renderWorlds();

        renderChecklist();

        updateProgress();
    }


    function getAllTasks() {

        const allTasks = [];

        for (
            const [
                sectionName,
                tasks
            ]
            of Object.entries(checklist)
        ) {

            if (
                !Array.isArray(tasks)
            ) {

                continue;
            }

            for (
                const task of tasks
            ) {

                if (
                    task &&
                    task.id &&
                    task.name
                ) {

                    allTasks.push({
                        id: task.id,
                        name: task.name,
                        section:
                            sectionName
                    });

                }

            }

        }

        return allTasks;
    }


    function getTaskCountForWorld(
        world
    ) {

        const tasks =
            getAllTasks();

        let completed = 0;

        for (
            const task of tasks
        ) {

            if (
                world.progress &&
                world.progress[task.id]
            ) {

                completed++;

            }

        }

        return {
            completed: completed,
            total: tasks.length
        };
    }


    function renderWorlds() {

        worldList.innerHTML = "";

        const worldEntries =
            Object.values(worlds);

        if (
            worldEntries.length === 0
        ) {

            worldList.innerHTML =
                '<div class="empty-state">' +
                'No worlds found.' +
                '</div>';

            return;
        }

        for (
            const world of worldEntries
        ) {

            const stats =
                getTaskCountForWorld(
                    world
                );

            const percentage =
                stats.total > 0
                    ? (
                        stats.completed /
                        stats.total
                    ) * 100
                    : 0;

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "world-card";

            if (
                world.id ===
                currentWorldId
            ) {

                card.classList.add(
                    "current"
                );

            }

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "world-card-title";

            title.textContent =
                world.name;

            const status =
                document.createElement(
                    "div"
                );

            status.className =
                "world-card-status";

            status.textContent =
                stats.completed +
                " / " +
                stats.total +
                " completed";

            const progress =
                document.createElement(
                    "div"
                );

            progress.className =
                "world-card-progress";

            const progressInner =
                document.createElement(
                    "div"
                );

            progressInner.className =
                "world-card-progress-fill";

            progressInner.style.width =
                percentage + "%";

            progress.appendChild(
                progressInner
            );

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "world-card-actions";

            const openButton =
                document.createElement(
                    "button"
                );

            openButton.type =
                "button";

            openButton.className =
                "small-button";

            openButton.textContent =
                world.id ===
                currentWorldId
                    ? "Current"
                    : "Open";

            openButton.addEventListener(
                "click",
                function () {

                    selectWorld(
                        world.id
                    );

                }
            );

            actions.appendChild(
                openButton
            );

            if (
                getWorldCount() > 1
            ) {

                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.type =
                    "button";

                deleteButton.className =
                    "small-button danger";

                deleteButton.textContent =
                    "Delete";

                deleteButton.addEventListener(
                    "click",
                    function () {

                        deleteWorld(
                            world.id
                        );

                    }
                );

                actions.appendChild(
                    deleteButton
                );

            }

            card.appendChild(
                title
            );

            card.appendChild(
                status
            );

            card.appendChild(
                progress
            );

            card.appendChild(
                actions
            );

            worldList.appendChild(
                card
            );
        }
    }


    function renderChecklist() {

        checklistElement.innerHTML = "";

        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            checklistElement.innerHTML =
                '<div class="empty-state">' +
                'No current world.' +
                '</div>';

            return;
        }

        const world =
            worlds[currentWorldId];

        const search =
            searchInput.value
                .trim()
                .toLowerCase();

        let sectionCount = 0;

        for (
            const [
                sectionName,
                tasks
            ]
            of Object.entries(checklist)
        ) {

            if (
                !Array.isArray(tasks)
            ) {

                continue;
            }

            const visibleTasks =
                tasks.filter(
                    task =>
                        task &&
                        task.id &&
                        task.name &&
                        (
                            !search ||
                            task.name
                                .toLowerCase()
                                .includes(
                                    search
                                ) ||
                            sectionName
                                .toLowerCase()
                                .includes(
                                    search
                                )
                        )
                );

            if (
                visibleTasks.length === 0
            ) {

                continue;

            }

            sectionCount++;

            const section =
                document.createElement(
                    "section"
                );

            section.className =
                "section";

            const sectionHeader =
                document.createElement(
                    "div"
                );

            sectionHeader.className =
                "section-header";

            const title =
                document.createElement(
                    "h2"
                );

            title.className =
                "section-title";

            title.textContent =
                sectionName;

            const count =
                document.createElement(
                    "div"
                );

            count.className =
                "section-count";

            let completedCount = 0;

            for (
                const task of visibleTasks
            ) {

                if (
                    world.progress &&
                    world.progress[task.id]
                ) {

                    completedCount++;

                }

            }

            count.textContent =
                completedCount +
                " / " +
                visibleTasks.length;

            sectionHeader.appendChild(
                title
            );

            sectionHeader.appendChild(
                count
            );

            const taskList =
                document.createElement(
                    "div"
                );

            taskList.className =
                "task-list";

            for (
                const task of visibleTasks
            ) {

                const taskElement =
                    document.createElement(
                        "label"
                    );

                taskElement.className =
                    "task";

                const checkbox =
                    document.createElement(
                        "input"
                    );

                checkbox.type =
                    "checkbox";

                checkbox.checked =
                    !!(
                        world.progress &&
                        world.progress[
                            task.id
                        ]
                    );

                const label =
                    document.createElement(
                        "span"
                    );

                label.className =
                    "task-label";

                label.textContent =
                    task.name;

                if (
                    checkbox.checked
                ) {

                    taskElement.classList.add(
                        "completed"
                    );

                }

                checkbox.addEventListener(
                    "change",
                    function () {

                        if (
                            !world.progress
                        ) {

                            world.progress =
                                {};

                        }

                        world.progress[
                            task.id
                        ] =
                            checkbox.checked;

                        if (
                            checkbox.checked
                        ) {

                            taskElement.classList.add(
                                "completed"
                            );

                        } else {

                            taskElement.classList.remove(
                                "completed"
                            );

                        }

                        saveWorlds();

                        renderWorlds();

                        updateProgress();

                    }
                );

                taskElement.appendChild(
                    checkbox
                );

                taskElement.appendChild(
                    label
                );

                taskList.appendChild(
                    taskElement
                );
            }

            section.appendChild(
                sectionHeader
            );

            section.appendChild(
                taskList
            );

            checklistElement.appendChild(
                section
            );
        }

        if (
            sectionCount === 0
        ) {

            checklistElement.innerHTML =
                '<div class="empty-state">' +
                'No checklist items match your search.' +
                '</div>';

        }
    }


    function updateProgress() {

        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            currentWorldName.textContent =
                "No World";

            progressText.textContent =
                "0 / 0 completed";

            progressFill.style.width =
                "0%";

            return;
        }

        const world =
            worlds[currentWorldId];

        const stats =
            getTaskCountForWorld(
                world
            );

        const percentage =
            stats.total > 0
                ? (
                    stats.completed /
                    stats.total
                ) * 100
                : 0;

        currentWorldName.textContent =
            world.name;

        progressText.textContent =
            stats.completed +
            " / " +
            stats.total +
            " completed";

        progressFill.style.width =
            percentage + "%";
    }


    function resetCurrentWorld() {

        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            return;
        }

        const world =
            worlds[currentWorldId];

        const confirmed =
            confirm(
                'Reset all checklist progress for "' +
                world.name +
                '"?'
            );

        if (!confirmed) {

            return;
        }

        world.progress = {};

        saveWorlds();

        renderWorlds();

        renderChecklist();

        updateProgress();
    }


    async function loadChecklist() {

        try {

            const response =
                await fetch(
                    CHECKLIST_URL +
                    "?updated=" +
                    Date.now(),
                    {
                        cache: "no-store"
                    }
                );

            if (!response.ok) {

                throw new Error(
                    "Could not load checklist.json"
                );

            }

            const newChecklist =
                await response.json();

            if (
                !newChecklist ||
                typeof newChecklist !==
                "object" ||
                Array.isArray(newChecklist)
            ) {

                throw new Error(
                    "checklist.json has an invalid format."
                );

            }

            const signature =
                JSON.stringify(
                    newChecklist
                );

            if (
                signature ===
                checklistSignature
            ) {

                return;

            }

            checklist =
                newChecklist;

            checklistSignature =
                signature;

            renderWorlds();

            renderChecklist();

            updateProgress();

        } catch (error) {

            console.error(
                "Checklist loading error:",
                error
            );

            if (
                Object.keys(checklist).length ===
                0
            ) {

                checklistElement.innerHTML =
                    '<div class="error">' +
                    'Could not load checklist.json.' +
                    '</div>';

            }

        }
    }


    newWorldButton.addEventListener(
        "click",
        createNewWorld
    );


    renameWorldButton.addEventListener(
        "click",
        renameCurrentWorld
    );


    resetWorldButton.addEventListener(
        "click",
        resetCurrentWorld
    );


    searchInput.addEventListener(
        "input",
        renderChecklist
    );


    loadWorlds();

    renderWorlds();

    updateProgress();

    loadChecklist();


    setInterval(
        loadChecklist,
        JSON_CHECK_INTERVAL
    );
</script>

</body>
