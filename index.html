<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#090b10"
    >

    <title>Versions</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            background: #090b10;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;

            overflow-x: hidden;
        }

        html {
            touch-action: pan-y;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #151a2b 0,
                    #090b10 45%
                );

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overscroll-behavior-x: none;
            touch-action: pan-y;
        }

        a,
        button {
            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;
        }

        input {
            touch-action: manipulation;

            -webkit-user-select: text;
            user-select: text;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            padding:
                44px 18px
                calc(
                    44px +
                    env(safe-area-inset-bottom)
                );
        }

        .container {
            width: 100%;
            max-width: 700px;

            margin: 0 auto;
        }

        .header {
            margin-bottom: 22px;
        }

        .eyebrow {
            margin-bottom: 8px;

            color: #818cf8;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            font-size:
                clamp(
                    32px,
                    7vw,
                    44px
                );

            line-height: 1.05;

            letter-spacing: -0.04em;
        }

        .description {
            max-width: 520px;

            margin: 10px 0 0;

            color: #9da4b3;

            font-size: 14px;
            line-height: 1.5;
        }

        .latest {
            display: flex;

            align-items: center;

            width: 100%;

            padding: 14px 16px;

            margin-bottom: 9px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #4338ca
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 10px;

            color: #ffffff;

            text-decoration: none;

            box-shadow:
                0 8px 24px
                rgba(
                    79,
                    70,
                    229,
                    0.18
                );

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .latest:hover {
            transform: translateY(-1px);

            box-shadow:
                0 11px 28px
                rgba(
                    79,
                    70,
                    229,
                    0.25
                );
        }

        .latest:active {
            transform: scale(0.99);
        }

        .latest-label {
            display: block;

            margin-bottom: 2px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.68
                );

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .latest-version {
            display: block;

            font-size: 17px;
            font-weight: 700;
        }

        .old-versions-button {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            min-height: 42px;

            padding: 9px 14px;

            margin-bottom: 14px;

            background: #11151d;

            border:
                1px solid
                #252c39;

            border-radius: 9px;

            color: #b9c0cc;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;

            outline: none;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease;
        }

        .old-versions-button:hover {
            background: #151a23;

            border-color: #4f46e5;

            color: #ffffff;
        }

        .old-versions-button:active {
            transform: scale(0.99);
        }

        .old-versions {
            display: none;
        }

        .old-versions.visible {
            display: block;
        }

        .toolbar {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 12px;
        }

        .search {
            position: relative;

            flex: 1;
        }

        .search-icon {
            position: absolute;

            top: 50%;
            left: 12px;

            width: 15px;
            height: 15px;

            transform:
                translateY(-50%);

            color: #747d8f;

            pointer-events: none;
        }

        .search input {
            width: 100%;

            min-height: 42px;

            padding:
                0 12px
                0 38px;

            background: #11151d;

            border:
                1px solid
                #252c39;

            border-radius: 9px;

            outline: none;

            color: #ffffff;

            font-family: inherit;
            font-size: 14px;

            -webkit-appearance: none;
            appearance: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .search input::-webkit-search-cancel-button {
            display: none;
        }

        .search input::placeholder {
            color: #687181;
        }

        .search input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.12
                );
        }

        .count {
            flex-shrink: 0;

            color: #747d8f;

            font-size: 12px;
        }

        .versions {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(120px, 1fr)
                );

            gap: 8px;
        }

        .version {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 50px;

            padding:
                9px 11px;

            background:
                rgba(
                    17,
                    21,
                    29,
                    0.92
                );

            border:
                1px solid
                #202633;

            border-radius: 9px;

            color: #ffffff;

            text-decoration: none;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .version:hover {
            transform: translateY(-1px);

            background: #151a23;

            border-color: #4f46e5;
        }

        .version:active {
            transform: scale(0.98);
        }

        .version-number {
            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            font-size: 15px;
            font-weight: 700;
        }

        .latest-tag {
            color: #818cf8;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .empty {
            display: none;

            padding: 32px 18px;

            border:
                1px dashed
                #2a3140;

            border-radius: 11px;

            color: #7f8898;

            text-align: center;
        }

        .empty-title {
            margin-bottom: 5px;

            color: #c5cad3;

            font-size: 15px;
            font-weight: 600;
        }

        .empty-description {
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .page {
                padding-top: 36px;
            }

            .toolbar {
                align-items: stretch;

                flex-direction: column;
            }

            .count {
                padding-left: 2px;
            }

            .versions {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );
            }
        }

        @media (max-width: 380px) {

            .versions {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="container">

            <header class="header">

                <div class="eyebrow">
                    Version Directory
                </div>

                <h1>
                    Versions
                </h1>

                <p class="description">
                    Browse and access every available
                    version.
                </p>

            </header>


            <!-- Latest version button -->

            <a
                id="latest"
                class="latest"
                href="#"
            >

                <span>

                    <span class="latest-label">
                        Latest Version
                    </span>

                    <span
                        id="latestVersion"
                        class="latest-version"
                    ></span>

                </span>

            </a>


            <!-- Old versions toggle -->

            <button
                id="oldVersionsButton"
                class="old-versions-button"
                type="button"
            >
                See old versions
            </button>


            <!-- All versions -->

            <section
                id="oldVersions"
                class="old-versions"
            >

                <div class="toolbar">

                    <div class="search">

                        <svg
                            class="search-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle
                                cx="11"
                                cy="11"
                                r="7"
                            ></circle>

                            <path
                                d="m20 20-4-4"
                            ></path>
                        </svg>

                        <input
                            id="search"
                            type="search"
                            placeholder="Search versions..."
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            enterkeyhint="search"
                        >

                    </div>

                    <div
                        id="count"
                        class="count"
                    ></div>

                </div>


                <section
                    id="versions"
                    class="versions"
                    aria-label="Available versions"
                ></section>


                <div
                    id="empty"
                    class="empty"
                >

                    <div class="empty-title">
                        No versions found
                    </div>

                    <div class="empty-description">
                        Try searching for another version.
                    </div>

                </div>

            </section>

        </div>

    </main>


    <script>

        /*
            Change ONLY this number.

            Example:

            2 = v2.0
            10 = v10.0
            27 = v27.0
        */

        const versionCount = 20000;


        /*
            Highest version is automatically
            considered the newest version.
        */

        const latestVersion =
            versionCount;


        const latest =
            document.getElementById(
                "latest"
            );

        const latestVersionText =
            document.getElementById(
                "latestVersion"
            );

        const oldVersionsButton =
            document.getElementById(
                "oldVersionsButton"
            );

        const oldVersions =
            document.getElementById(
                "oldVersions"
            );

        const versions =
            document.getElementById(
                "versions"
            );

        const search =
            document.getElementById(
                "search"
            );

        const count =
            document.getElementById(
                "count"
            );

        const empty =
            document.getElementById(
                "empty"
            );


        /*
            Format the version for display.

            2 becomes 2.0
            10 becomes 10.0
        */

        function formatVersion(version) {

            return version + ".0";

        }


        /*
            Set latest version.
        */

        latest.href =
            "./v" +
            latestVersion;

        latestVersionText.textContent =
            "v" +
            formatVersion(
                latestVersion
            );


        /*
            Generate ALL versions.

            Newest version appears first.

            The newest version is included in
            the full list and marked "(Latest)".
        */

        for (
            let version = versionCount;
            version >= 1;
            version--
        ) {

            const link =
                document.createElement(
                    "a"
                );

            link.className =
                "version";

            /*
                Keep the actual URL as /v2,
                /v3, etc.
            */

            link.href =
                "./v" +
                version;

            /*
                Store the plain number so searching
                works with both 2 and 2.0.
            */

            link.dataset.version =
                String(version);


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "version-number";

            number.textContent =
                "v" +
                formatVersion(
                    version
                );


            if (
                version === latestVersion
            ) {

                const latestTag =
                    document.createElement(
                        "span"
                    );

                latestTag.className =
                    "latest-tag";

                latestTag.textContent =
                    "(Latest)";

                number.appendChild(
                    latestTag
                );
            }


            link.appendChild(
                number
            );

            versions.appendChild(
                link
            );
        }


        /*
            Search versions.

            Examples:

            2
            2.0
            v2
            v2.0
            version 2
            version 2.0
        */

        function filterVersions() {

            const query =
                search.value
                    .trim()
                    .toLowerCase()
                    .replace(
                        /^version\s*/,
                        ""
                    )
                    .replace(
                        /^v/,
                        ""
                    );


            /*
                Normalize searches such as:

                2.0 -> 2
                2 -> 2
            */

            const normalizedQuery =
                query.replace(
                    /\.0$/,
                    ""
                );


            const versionLinks =
                versions.querySelectorAll(
                    ".version"
                );


            let visibleCount = 0;


            versionLinks.forEach(
                function (link) {

                    const version =
                        link.dataset.version;


                    const matches =
                        normalizedQuery === "" ||
                        version.includes(
                            normalizedQuery
                        );


                    link.style.display =
                        matches
                            ? ""
                            : "none";


                    if (matches) {
                        visibleCount++;
                    }

                }
            );


            count.textContent =
                visibleCount +
                " of " +
                versionLinks.length +
                " versions";


            empty.style.display =
                visibleCount === 0
                    ? "block"
                    : "none";
        }


        /*
            Show all versions.

            The separate latest button disappears.
        */

        oldVersionsButton.addEventListener(
            "click",
            function () {

                const showing =
                    oldVersions.classList.contains(
                        "visible"
                    );


                if (!showing) {

                    oldVersions.classList.add(
                        "visible"
                    );

                    latest.style.display =
                        "none";

                    oldVersionsButton.textContent =
                        "Hide old versions";

                    filterVersions();

                } else {

                    oldVersions.classList.remove(
                        "visible"
                    );

                    latest.style.display =
                        "flex";

                    oldVersionsButton.textContent =
                        "See old versions";

                    search.value = "";

                }

            }
        );


        search.addEventListener(
            "input",
            filterVersions
        );


        /*
            Prevent multi-touch pinch zoom.
        */

        function preventMultiTouch(event) {

            if (
                event.touches &&
                event.touches.length > 1
            ) {
                event.preventDefault();
            }
        }


        document.addEventListener(
            "touchstart",
            preventMultiTouch,
            {
                passive: false
            }
        );


        document.addEventListener(
            "touchmove",
            preventMultiTouch,
            {
                passive: false
            }
        );


        /*
            Prevent iOS gesture zoom.
        */

        document.addEventListener(
            "gesturestart",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );


        /*
            Prevent double-tap zoom.
        */

        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            function (event) {

                const now =
                    Date.now();

                if (
                    now - lastTouchEnd < 400
                ) {
                    event.preventDefault();
                }

                lastTouchEnd = now;

            },
            {
                passive: false
            }
        );


        /*
            Prevent double-click zoom where
            the browser supports cancelling it.
        */

        document.addEventListener(
            "dblclick",
            function (event) {
                event.preventDefault();
            }
        );


        /*
            Prevent Ctrl/Cmd + mouse-wheel zoom.
        */

        document.addEventListener(
            "wheel",
            function (event) {

                if (
                    event.ctrlKey ||
                    event.metaKey
                ) {
                    event.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        /*
            Prevent Ctrl/Cmd keyboard zoom shortcuts
            where the browser allows cancellation.
        */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.ctrlKey ||
                    event.metaKey
                ) {

                    if (
                        event.key === "+" ||
                        event.key === "-" ||
                        event.key === "=" ||
                        event.key === "0"
                    ) {
                        event.preventDefault();
                    }

                }

            }
        );

    </script>

</body>
</html>
