<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Survival Checklist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0f0c;
            --panel: #121814;
            --panel-2: #182019;
            --border: #2a382d;
            --text: #edf5ee;
            --muted: #9baa9d;
            --green: #55c96b;
            --green-dark: #245d30;
            --red: #d95757;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            padding: 20px;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 5vw, 36px);
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        select,
        input[type="search"] {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            padding: 0 13px;
            outline: none;
        }

        select {
            min-width: 180px;
        }

        input[type="search"] {
            flex: 1;
            min-width: 200px;
        }

        select:focus,
        input[type="search"]:focus {
            border-color: var(--green);
        }

        .button {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 15px;
        }

        .button:hover {
            border-color: var(--green);
        }

        .button.primary {
            background: var(--green-dark);
            border-color: var(--green);
        }

        .button.danger {
            color: #ff8a8a;
        }

        .progress-panel {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .progress-text {
            color: var(--muted);
        }

        .progress-bar {
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: #202a22;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--green);
            transition: width 0.2s ease;
        }

        #worldManager {
            margin-bottom: 25px;
        }

        .world-manager-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .world-manager-header h2 {
            margin: 0;
        }

        .world-count {
            color: var(--muted);
        }

        .world-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(240px, 1fr)
            );
            gap: 12px;
        }

        .world-card {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .world-card.current {
            border-color: var(--green);
        }

        .world-card h3 {
            margin: 0 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .world-progress {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .world-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .world-actions button {
            min-height: 36px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 10px;
        }

        .world-actions button:hover {
            border-color: var(--green);
        }

        .world-actions .delete-world {
            color: #ff8a8a;
        }

        #checklist {
            display: grid;
            gap: 16px;
        }

        .section {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--panel);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 16px;
            background: var(--panel-2);
            border-bottom: 1px solid var(--border);
        }

        .section-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .section-count {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        .tasks {
            padding: 6px 16px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            border-bottom: 1px solid #202a22;
        }

        .task:last-child {
            border-bottom: 0;
        }

        .task input {
            width: 19px;
            height: 19px;
            flex: 0 0 auto;
            accent-color: var(--green);
        }

        .task label {
            flex: 1;
            padding: 12px 0;
            cursor: pointer;
            line-height: 1.4;
        }

        .task.completed label {
            color: var(--muted);
            text-decoration: line-through;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .controls {
                flex-direction: column;
            }

            select,
            input[type="search"],
            .button {
                width: 100%;
            }

            .section-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header>
            <div class="topbar">
                <div>
                    <h1>Minecraft Survival Checklist</h1>

                    <p class="subtitle">
                        Track your survival progress across your worlds.
                    </p>
                </div>
            </div>

            <div class="controls">

                <select
                    id="worldSelect"
                    aria-label="Select world"
                ></select>

                <button
                    class="button primary"
                    id="newWorldButton"
                    type="button"
                >
                    New World
                </button>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search checklist..."
                    autocomplete="off"
                >

                <button
                    class="button danger"
                    id="resetButton"
                    type="button"
                >
                    Reset Current World
                </button>

            </div>

            <div class="progress-panel">

                <div class="progress-header">

                    <strong id="currentWorldName">
                        World 1
                    </strong>

                    <span
                        class="progress-text"
                        id="overallProgress"
                    >
                        0 / 0 complete
                    </span>

                </div>

                <div class="progress-bar">

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

            </div>
        </header>

        <section id="worldManager">

            <div class="world-manager-header">

                <div>

                    <h2>Your Worlds</h2>

                    <div
                        class="world-count"
                        id="worldCount"
                    >
                        0 / 100 worlds
                    </div>

                </div>

            </div>

            <div
                class="world-grid"
                id="worldGrid"
            ></div>

        </section>

        <section id="checklist"></section>

    </main>

    <script>
        const WORLDS_STORAGE_KEY =
            "minecraft-survival-todo-worlds";

        const CURRENT_WORLD_STORAGE_KEY =
            "minecraft-survival-todo-worlds-current";

        const MAX_WORLDS = 100;

        const CHECKLIST_URL =
            "checklist.json";

        /*
         * How often the page checks checklist.json.
         *
         * 2000 = every 2 seconds.
         *
         * The cache-busting query makes sure the browser
         * asks the server for the newest JSON instead of
         * reusing an old cached copy.
         */
        const JSON_CHECK_INTERVAL = 2000;

        let checklist = {};

        let worlds = {};

        let currentWorldId = null;

        let checklistSignature = "";

        let updatingFromExternalChange = false;


        const checklistElement =
            document.getElementById(
                "checklist"
            );

        const worldSelect =
            document.getElementById(
                "worldSelect"
            );

        const worldGrid =
            document.getElementById(
                "worldGrid"
            );

        const worldCount =
            document.getElementById(
                "worldCount"
            );

        const currentWorldName =
            document.getElementById(
                "currentWorldName"
            );

        const overallProgress =
            document.getElementById(
                "overallProgress"
            );

        const progressFill =
            document.getElementById(
                "progressFill"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const newWorldButton =
            document.getElementById(
                "newWorldButton"
            );

        const resetButton =
            document.getElementById(
                "resetButton"
            );


        function generateWorldId() {
            return (
                Date.now().toString(36) +
                Math.random()
                    .toString(36)
                    .substring(2, 9)
            );
        }


        function saveWorlds() {
            localStorage.setItem(
                WORLDS_STORAGE_KEY,
                JSON.stringify(worlds)
            );

            localStorage.setItem(
                CURRENT_WORLD_STORAGE_KEY,
                currentWorldId
            );

            /*
             * The browser's "storage" event does NOT fire
             * in the same tab that changed localStorage.
             *
             * Dispatch our own event so this page also
             * follows the same update path.
             */
            window.dispatchEvent(
                new CustomEvent(
                    "minecraftChecklistStorageChanged"
                )
            );
        }


        function loadWorlds() {

            try {

                const savedWorlds =
                    localStorage.getItem(
                        WORLDS_STORAGE_KEY
                    );

                if (savedWorlds) {
                    worlds =
                        JSON.parse(
                            savedWorlds
                        );
                }

            } catch (error) {

                console.error(
                    "Could not read saved worlds:",
                    error
                );

                worlds = {};
            }


            if (
                !worlds ||
                typeof worlds !== "object" ||
                Array.isArray(worlds)
            ) {
                worlds = {};
            }


            const savedCurrentWorld =
                localStorage.getItem(
                    CURRENT_WORLD_STORAGE_KEY
                );


            if (
                savedCurrentWorld &&
                worlds[savedCurrentWorld]
            ) {

                currentWorldId =
                    savedCurrentWorld;

            }


            if (
                !currentWorldId ||
                !worlds[currentWorldId]
            ) {

                const worldIds =
                    Object.keys(worlds);


                if (
                    worldIds.length > 0
                ) {

                    currentWorldId =
                        worldIds[0];

                } else {

                    createInitialWorld();

                }

            }
        }


        function createInitialWorld() {

            const id =
                generateWorldId();


            worlds[id] = {

                name: "World 1",

                progress: {}

            };


            currentWorldId = id;


            localStorage.setItem(
                WORLDS_STORAGE_KEY,
                JSON.stringify(worlds)
            );

            localStorage.setItem(
                CURRENT_WORLD_STORAGE_KEY,
                currentWorldId
            );
        }


        function createWorld() {

            const worldIds =
                Object.keys(worlds);


            if (
                worldIds.length >= MAX_WORLDS
            ) {

                alert(
                    "You already have 100 worlds."
                );

                return;
            }


            const requestedName =
                prompt(
                    "Enter a name for the new world:",
                    "World " +
                    (
                        worldIds.length + 1
                    )
                );


            if (
                requestedName === null
            ) {
                return;
            }


            const name =
                requestedName.trim();


            if (!name) {

                alert(
                    "World name cannot be empty."
                );

                return;
            }


            const id =
                generateWorldId();


            worlds[id] = {

                name,

                progress: {}

            };


            currentWorldId = id;


            saveWorlds();

            renderAll();
        }


        function switchWorld(id) {

            if (!worlds[id]) {
                return;
            }


            currentWorldId = id;


            saveWorlds();


            searchInput.value = "";


            renderAll();
        }


        function renameWorld(id) {

            if (!worlds[id]) {
                return;
            }


            const newName =
                prompt(
                    "Enter a new world name:",
                    worlds[id].name
                );


            if (
                newName === null
            ) {
                return;
            }


            const name =
                newName.trim();


            if (!name) {

                alert(
                    "World name cannot be empty."
                );

                return;
            }


            worlds[id].name =
                name;


            saveWorlds();

            renderAll();
        }


        function deleteWorld(id) {

            if (!worlds[id]) {
                return;
            }


            const name =
                worlds[id].name;


            const confirmed =
                confirm(
                    'Delete "' +
                    name +
                    '"? This will permanently delete its checklist progress.'
                );


            if (!confirmed) {
                return;
            }


            delete worlds[id];


            const remainingIds =
                Object.keys(worlds);


            if (
                remainingIds.length === 0
            ) {

                createInitialWorld();

            } else if (
                id === currentWorldId
            ) {

                currentWorldId =
                    remainingIds[0];

            }


            saveWorlds();

            renderAll();
        }


        function resetCurrentWorld() {

            if (
                !worlds[currentWorldId]
            ) {
                return;
            }


            const confirmed =
                confirm(
                    'Reset all checklist progress for "' +
                    worlds[currentWorldId].name +
                    '"?'
                );


            if (!confirmed) {
                return;
            }


            worlds[currentWorldId].progress =
                {};


            saveWorlds();

            renderAll();
        }


        function getAllTasks() {

            const tasks = [];


            for (
                const sectionName in checklist
            ) {

                const sectionTasks =
                    checklist[
                        sectionName
                    ];


                if (
                    !Array.isArray(
                        sectionTasks
                    )
                ) {
                    continue;
                }


                for (
                    const task of sectionTasks
                ) {

                    if (
                        task &&
                        task.id &&
                        task.text
                    ) {

                        tasks.push(task);

                    }

                }

            }


            return tasks;
        }


        function getWorldProgress(world) {

            const tasks =
                getAllTasks();


            let completed = 0;


            for (
                const task of tasks
            ) {

                if (
                    world.progress &&
                    world.progress[
                        task.id
                    ] === true
                ) {

                    completed++;

                }

            }


            return {

                completed,

                total:
                    tasks.length

            };
        }


        function renderWorldSelector() {

            worldSelect.innerHTML = "";


            Object.entries(worlds)
                .forEach(
                    (
                        [id, world]
                    ) => {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            id;


                        option.textContent =
                            world.name;


                        if (
                            id ===
                            currentWorldId
                        ) {

                            option.selected =
                                true;

                        }


                        worldSelect
                            .appendChild(
                                option
                            );

                    }
                );
        }


        function renderWorldManager() {

            const worldEntries =
                Object.entries(
                    worlds
                );


            worldCount.textContent =
                worldEntries.length +
                " / " +
                MAX_WORLDS +
                " worlds";


            worldGrid.innerHTML = "";


            worldEntries.forEach(
                (
                    [id, world]
                ) => {

                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "world-card";


                    if (
                        id ===
                        currentWorldId
                    ) {

                        card.classList.add(
                            "current"
                        );

                    }


                    const progress =
                        getWorldProgress(
                            world
                        );


                    const percentage =
                        progress.total === 0
                            ? 0
                            : Math.round(
                                (
                                    progress.completed /
                                    progress.total
                                ) *
                                100
                            );


                    card.innerHTML = `
                        <h3></h3>

                        <div class="world-progress">
                            ${progress.completed}
                            /
                            ${progress.total}
                            complete
                            (${percentage}%)
                        </div>

                        <div class="world-actions">

                            <button
                                type="button"
                                class="open-world"
                            >
                                Open
                            </button>

                            <button
                                type="button"
                                class="rename-world"
                            >
                                Rename
                            </button>

                            <button
                                type="button"
                                class="delete-world"
                            >
                                Delete
                            </button>

                        </div>
                    `;


                    card.querySelector(
                        "h3"
                    ).textContent =
                        world.name;


                    card.querySelector(
                        ".open-world"
                    ).addEventListener(
                        "click",
                        () =>
                            switchWorld(id)
                    );


                    card.querySelector(
                        ".rename-world"
                    ).addEventListener(
                        "click",
                        () =>
                            renameWorld(id)
                    );


                    card.querySelector(
                        ".delete-world"
                    ).addEventListener(
                        "click",
                        () =>
                            deleteWorld(id)
                    );


                    worldGrid.appendChild(
                        card
                    );

                }
            );
        }


        function renderChecklist() {

            checklistElement.innerHTML = "";


            const world =
                worlds[currentWorldId];


            if (!world) {
                return;
            }


            if (!world.progress) {
                world.progress = {};
            }


            const search =
                searchInput.value
                    .trim()
                    .toLowerCase();


            let visibleTasks = 0;


            for (
                const [
                    sectionName,
                    tasks
                ] of Object.entries(
                    checklist
                )
            ) {

                if (
                    !Array.isArray(
                        tasks
                    )
                ) {
                    continue;
                }


                const matchingTasks =
                    tasks.filter(
                        task =>
                            task &&
                            task.id &&
                            task.text &&
                            (
                                !search ||
                                task.text
                                    .toLowerCase()
                                    .includes(
                                        search
                                    ) ||
                                sectionName
                                    .toLowerCase()
                                    .includes(
                                        search
                                    )
                            )
                    );


                if (
                    matchingTasks.length === 0
                ) {
                    continue;
                }


                visibleTasks +=
                    matchingTasks.length;


                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "section";


                const sectionHeader =
                    document.createElement(
                        "div"
                    );


                sectionHeader.className =
                    "section-header";


                const title =
                    document.createElement(
                        "h2"
                    );


                title.textContent =
                    sectionName;


                const count =
                    document.createElement(
                        "span"
                    );


                count.className =
                    "section-count";


                const completed =
                    tasks.filter(
                        task =>
                            task &&
                            task.id &&
                            world.progress[
                                task.id
                            ] === true
                    ).length;


                count.textContent =
                    completed +
                    " / " +
                    tasks.length;


                sectionHeader.appendChild(
                    title
                );


                sectionHeader.appendChild(
                    count
                );


                section.appendChild(
                    sectionHeader
                );


                const taskContainer =
                    document.createElement(
                        "div"
                    );


                taskContainer.className =
                    "tasks";


                matchingTasks.forEach(
                    task => {

                        const row =
                            document.createElement(
                                "div"
                            );


                        row.className =
                            "task";


                        const isCompleted =
                            world.progress[
                                task.id
                            ] === true;


                        if (isCompleted) {

                            row.classList.add(
                                "completed"
                            );

                        }


                        const checkbox =
                            document.createElement(
                                "input"
                            );


                        checkbox.type =
                            "checkbox";


                        checkbox.id =
                            "task-" +
                            task.id;


                        checkbox.checked =
                            isCompleted;


                        const label =
                            document.createElement(
                                "label"
                            );


                        label.htmlFor =
                            checkbox.id;


                        label.textContent =
                            task.text;


                        checkbox.addEventListener(
                            "change",
                            () => {

                                if (
                                    !world.progress
                                ) {

                                    world.progress =
                                        {};

                                }


                                world.progress[
                                    task.id
                                ] =
                                    checkbox.checked;


                                if (
                                    checkbox.checked
                                ) {

                                    row.classList.add(
                                        "completed"
                                    );

                                } else {

                                    row.classList.remove(
                                        "completed"
                                    );

                                }


                                saveWorlds();


                                updateProgress();

                                renderWorldManager();

                                updateSectionCounts();

                            }
                        );


                        row.appendChild(
                            checkbox
                        );


                        row.appendChild(
                            label
                        );


                        taskContainer.appendChild(
                            row
                        );

                    }
                );


                section.appendChild(
                    taskContainer
                );


                checklistElement.appendChild(
                    section
                );

            }


            if (
                visibleTasks === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );


                empty.className =
                    "empty";


                empty.textContent =
                    "No checklist items match your search.";


                checklistElement.appendChild(
                    empty
                );

            }


            updateProgress();
        }


        function updateProgress() {

            const world =
                worlds[currentWorldId];


            if (!world) {
                return;
            }


            const progress =
                getWorldProgress(
                    world
                );


            const percentage =
                progress.total === 0
                    ? 0
                    : Math.round(
                        (
                            progress.completed /
                            progress.total
                        ) *
                        100
                    );


            currentWorldName.textContent =
                world.name;


            overallProgress.textContent =
                progress.completed +
                " / " +
                progress.total +
                " complete";


            progressFill.style.width =
                percentage +
                "%";
        }


        function updateSectionCounts() {

            const world =
                worlds[currentWorldId];


            if (!world) {
                return;
            }


            const sections =
                document.querySelectorAll(
                    ".section"
                );


            sections.forEach(
                section => {

                    const title =
                        section.querySelector(
                            "h2"
                        );


                    const count =
                        section.querySelector(
                            ".section-count"
                        );


                    if (
                        !title ||
                        !count
                    ) {
                        return;
                    }


                    const tasks =
                        checklist[
                            title.textContent
                        ];


                    if (
                        !Array.isArray(
                            tasks
                        )
                    ) {
                        return;
                    }


                    const completed =
                        tasks.filter(
                            task =>
                                task &&
                                task.id &&
                                world.progress[
                                    task.id
                                ] === true
                        ).length;


                    count.textContent =
                        completed +
                        " / " +
                        tasks.length;

                }
            );
        }


        function renderAll() {

            renderWorldSelector();

            renderWorldManager();

            renderChecklist();
        }


        /*
         * Load checklist.json.
         *
         * A timestamp is added to the request so the browser
         * doesn't keep returning an old cached JSON file.
         */
        async function loadChecklist(
            forceRender = true
        ) {

            try {

                const response =
                    await fetch(
                        CHECKLIST_URL +
                        "?updated=" +
                        Date.now(),
                        {
                            cache: "no-store"
                        }
                    );


                if (
                    !response.ok
                ) {

                    throw new Error(
                        "Could not load checklist.json"
                    );

                }


                const newChecklist =
                    await response.json();


                const newSignature =
                    JSON.stringify(
                        newChecklist
                    );


                /*
                 * If the JSON has not changed,
                 * don't rebuild the UI.
                 */
                if (
                    !forceRender &&
                    newSignature ===
                    checklistSignature
                ) {

                    return;

                }


                const oldChecklist =
                    checklist;


                checklist =
                    newChecklist;


                checklistSignature =
                    newSignature;


                /*
                 * Existing progress is stored by task ID,
                 * so changing the JSON does NOT erase progress.
                 *
                 * New tasks automatically start unchecked.
                 *
                 * Removed tasks simply stop appearing.
                 */


                if (
                    Object.keys(
                        oldChecklist
                    ).length > 0
                ) {

                    console.log(
                        "checklist.json changed. UI updated."
                    );

                }


                renderAll();

            } catch (error) {

                console.error(
                    "Could not load checklist.json:",
                    error
                );


                if (
                    forceRender
                ) {

                    checklistElement.innerHTML = `
                        <div class="empty">
                            Could not load checklist.json.
                            Make sure it is in the same folder as index.html.
                        </div>
                    `;

                }

            }
        }


        /*
         * Check checklist.json every 2 seconds.
         *
         * This means you can edit checklist.json on GitHub,
         * commit it, and an already-open page will eventually
         * detect the change and rebuild its UI.
         */
        function startChecklistWatcher() {

            setInterval(
                () => {

                    loadChecklist(
                        false
                    );

                },
                JSON_CHECK_INTERVAL
            );

        }


        /*
         * localStorage changes made in ANOTHER browser tab
         * trigger the native storage event.
         */
        window.addEventListener(
            "storage",
            event => {

                if (
                    event.key ===
                    WORLDS_STORAGE_KEY ||
                    event.key ===
                    CURRENT_WORLD_STORAGE_KEY
                ) {

                    loadWorlds();

                    renderAll();

                }

            }
        );


        /*
         * Changes made by THIS tab use our custom event.
         */
        window.addEventListener(
            "minecraftChecklistStorageChanged",
            () => {

                if (
                    updatingFromExternalChange
                ) {
                    return;
                }


                loadWorlds();

                renderAll();

            }
        );


        worldSelect.addEventListener(
            "change",
            event => {

                switchWorld(
                    event.target.value
                );

            }
        );


        newWorldButton.addEventListener(
            "click",
            createWorld
        );


        resetButton.addEventListener(
            "click",
            resetCurrentWorld
        );


        searchInput.addEventListener(
            "input",
            renderChecklist
        );


        async function initialize() {

            loadWorlds();

            await loadChecklist(
                true
            );

            startChecklistWatcher();

        }


        initialize();
    </script>
</body>
</html>
