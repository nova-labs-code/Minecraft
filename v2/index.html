<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Minecraft Survival Checklist</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0f0c;
            --panel: #121814;
            --panel-2: #182019;
            --border: #2a382d;
            --text: #edf5ee;
            --muted: #9baa9d;
            --green: #55c96b;
            --green-dark: #245d30;
            --red: #d95757;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            padding: 20px;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        .topbar {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 5vw, 36px);
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        select,
        input[type="search"] {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            padding: 0 13px;
            outline: none;
        }

        select {
            min-width: 180px;
        }

        input[type="search"] {
            flex: 1;
            min-width: 200px;
        }

        select:focus,
        input[type="search"]:focus {
            border-color: var(--green);
        }

        .button {
            min-height: 44px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 15px;
        }

        .button:hover {
            border-color: var(--green);
        }

        .button.primary {
            background: var(--green-dark);
            border-color: var(--green);
        }

        .button.danger {
            color: #ff8a8a;
        }

        .progress-panel {
            margin-top: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .progress-text {
            color: var(--muted);
        }

        .progress-bar {
            height: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: #202a22;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--green);
            transition: width 0.25s ease;
        }

        #worldManager {
            margin-bottom: 25px;
        }

        .world-manager-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .world-manager-header h2 {
            margin: 0;
        }

        .world-count {
            color: var(--muted);
        }

        .world-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(240px, 1fr)
            );
            gap: 12px;
        }

        .world-card {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .world-card.current {
            border-color: var(--green);
        }

        .world-card h3 {
            margin: 0 0 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .world-progress {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 12px;
        }

        .world-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .world-actions button {
            min-height: 36px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel-2);
            color: var(--text);
            padding: 0 10px;
        }

        .world-actions button:hover {
            border-color: var(--green);
        }

        .world-actions .delete-world {
            color: #ff8a8a;
        }

        #checklist {
            display: grid;
            gap: 16px;
        }

        .section {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--panel);

            /*
             * Small animation when sections are created
             * or updated.
             */
            animation:
                sectionAppear 0.25s ease both;
        }

        @keyframes sectionAppear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 56px;
            padding: 15px 16px;
            background: var(--panel-2);
            border-bottom: 1px solid transparent;

            cursor: pointer;

            user-select: none;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .section-header:hover {
            background: #1c261e;
        }

        .section.open .section-header {
            border-bottom-color: var(--border);
        }

        .section-title-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .section-arrow {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--muted);
            font-size: 13px;

            transition:
                transform 0.3s ease,
                color 0.2s ease;
        }

        .section.open .section-arrow {
            transform: rotate(90deg);
            color: var(--green);
        }

        .section-header h2 {
            margin: 0;
            font-size: 19px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .section-count {
            color: var(--muted);
            font-size: 14px;
            white-space: nowrap;
        }

        /*
         * The task area is animated using grid rows.
         *
         * 0fr = completely collapsed.
         * 1fr = expanded.
         *
         * This gives us a smooth height animation without
         * needing JavaScript to calculate the height.
         */
        .section-content {
            display: grid;
            grid-template-rows: 0fr;

            transition:
                grid-template-rows 0.3s ease;
        }

        .section.open .section-content {
            grid-template-rows: 1fr;
        }

        .section-content-inner {
            min-height: 0;
            overflow: hidden;
        }

        .tasks {
            padding: 6px 16px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            border-bottom: 1px solid #202a22;

            opacity: 0;
            transform: translateY(-4px);

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .section.open .task {
            opacity: 1;
            transform: translateY(0);
        }

        .task:last-child {
            border-bottom: 0;
        }

        .task input {
            width: 19px;
            height: 19px;
            flex: 0 0 auto;
            accent-color: var(--green);
            cursor: pointer;
        }

        .task label {
            flex: 1;
            padding: 12px 0;
            cursor: pointer;
            line-height: 1.4;
        }

        .task.completed label {
            color: var(--muted);
            text-decoration: line-through;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .controls {
                flex-direction: column;
            }

            select,
            input[type="search"],
            .button {
                width: 100%;
            }

            .section-header {
                align-items: center;
            }

            .section-header h2 {
                font-size: 17px;
            }

            .section-count {
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <header>

        <div class="topbar">

            <div>

                <h1>
                    Minecraft Survival Checklist
                </h1>

                <p class="subtitle">
                    Track your survival progress across your worlds.
                </p>

            </div>

        </div>

        <div class="controls">

            <select
                id="worldSelect"
                aria-label="Select world"
            ></select>

            <button
                class="button primary"
                id="newWorldButton"
                type="button"
            >
                New World
            </button>

            <input
                id="searchInput"
                type="search"
                placeholder="Search checklist..."
                autocomplete="off"
            >

            <button
                class="button danger"
                id="resetButton"
                type="button"
            >
                Reset Current World
            </button>

        </div>

        <div class="progress-panel">

            <div class="progress-header">

                <strong id="currentWorldName">
                    World 1
                </strong>

                <span
                    class="progress-text"
                    id="overallProgress"
                >
                    0 / 0 complete
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill"
                ></div>

            </div>

        </div>

    </header>


    <section id="worldManager">

        <div class="world-manager-header">

            <div>

                <h2>
                    Your Worlds
                </h2>

                <div
                    class="world-count"
                    id="worldCount"
                >
                    0 / 100 worlds
                </div>

            </div>

        </div>

        <div
            class="world-grid"
            id="worldGrid"
        ></div>

    </section>


    <section id="checklist"></section>

</main>


<script>

    const WORLDS_STORAGE_KEY =
        "minecraft-survival-todo-worlds";

    const CURRENT_WORLD_STORAGE_KEY =
        "minecraft-survival-todo-worlds-current";

    const MAX_WORLDS =
        100;

    const CHECKLIST_URL =
        "checklist.json";

    const JSON_CHECK_INTERVAL =
        2000;


    let checklist = {};

    let worlds = {};

    let currentWorldId = null;

    let checklistSignature = "";


    const checklistElement =
        document.getElementById(
            "checklist"
        );

    const worldSelect =
        document.getElementById(
            "worldSelect"
        );

    const worldGrid =
        document.getElementById(
            "worldGrid"
        );

    const worldCount =
        document.getElementById(
            "worldCount"
        );

    const currentWorldName =
        document.getElementById(
            "currentWorldName"
        );

    const overallProgress =
        document.getElementById(
            "overallProgress"
        );

    const progressFill =
        document.getElementById(
            "progressFill"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const newWorldButton =
        document.getElementById(
            "newWorldButton"
        );

    const resetButton =
        document.getElementById(
            "resetButton"
        );


    function generateWorldId() {

        return (
            Date.now().toString(36) +
            Math.random()
                .toString(36)
                .substring(2, 9)
        );

    }


    function saveWorlds() {

        localStorage.setItem(
            WORLDS_STORAGE_KEY,
            JSON.stringify(
                worlds
            )
        );

        localStorage.setItem(
            CURRENT_WORLD_STORAGE_KEY,
            currentWorldId
        );

    }


    function loadWorlds() {

        try {

            const savedWorlds =
                localStorage.getItem(
                    WORLDS_STORAGE_KEY
                );


            if (savedWorlds) {

                worlds =
                    JSON.parse(
                        savedWorlds
                    );

            }

        } catch (error) {

            console.error(
                "Could not read saved worlds:",
                error
            );

            worlds = {};

        }


        if (
            !worlds ||
            typeof worlds !== "object" ||
            Array.isArray(worlds)
        ) {

            worlds = {};

        }


        const savedCurrentWorld =
            localStorage.getItem(
                CURRENT_WORLD_STORAGE_KEY
            );


        if (
            savedCurrentWorld &&
            worlds[savedCurrentWorld]
        ) {

            currentWorldId =
                savedCurrentWorld;

        }


        if (
            !currentWorldId ||
            !worlds[currentWorldId]
        ) {

            const worldIds =
                Object.keys(
                    worlds
                );


            if (
                worldIds.length > 0
            ) {

                currentWorldId =
                    worldIds[0];

            } else {

                createInitialWorld();

            }

        }


        for (
            const world of Object.values(
                worlds
            )
        ) {

            if (
                !world.progress ||
                typeof world.progress !== "object"
            ) {

                world.progress = {};

            }

        }

    }


    function createInitialWorld() {

        const id =
            generateWorldId();


        worlds[id] = {

            name: "World 1",

            progress: {}

        };


        currentWorldId =
            id;


        saveWorlds();

    }


    function createWorld() {

        const worldIds =
            Object.keys(
                worlds
            );


        if (
            worldIds.length >=
            MAX_WORLDS
        ) {

            alert(
                "You already have 100 worlds."
            );

            return;

        }


        const requestedName =
            prompt(
                "Enter a name for the new world:",
                "World " +
                (
                    worldIds.length +
                    1
                )
            );


        if (
            requestedName === null
        ) {

            return;

        }


        const name =
            requestedName.trim();


        if (!name) {

            alert(
                "World name cannot be empty."
            );

            return;

        }


        const id =
            generateWorldId();


        worlds[id] = {

            name,

            progress: {}

        };


        currentWorldId =
            id;


        saveWorlds();

        searchInput.value = "";

        renderAll();

    }


    function switchWorld(id) {

        if (
            !worlds[id]
        ) {

            return;

        }


        currentWorldId =
            id;


        saveWorlds();


        searchInput.value =
            "";


        renderAll();

    }


    function renameWorld(id) {

        if (
            !worlds[id]
        ) {

            return;

        }


        const newName =
            prompt(
                "Enter a new world name:",
                worlds[id].name
            );


        if (
            newName === null
        ) {

            return;

        }


        const name =
            newName.trim();


        if (!name) {

            alert(
                "World name cannot be empty."
            );

            return;

        }


        worlds[id].name =
            name;


        saveWorlds();

        renderAll();

    }


    function deleteWorld(id) {

        if (
            !worlds[id]
        ) {

            return;

        }


        const name =
            worlds[id].name;


        const confirmed =
            confirm(
                'Delete "' +
                name +
                '"? This will permanently delete its checklist progress.'
            );


        if (!confirmed) {

            return;

        }


        delete worlds[id];


        const remainingIds =
            Object.keys(
                worlds
            );


        if (
            remainingIds.length === 0
        ) {

            createInitialWorld();

        } else if (
            id === currentWorldId
        ) {

            currentWorldId =
                remainingIds[0];

        }


        saveWorlds();

        renderAll();

    }


    function resetCurrentWorld() {

        if (
            !worlds[currentWorldId]
        ) {

            return;

        }


        const confirmed =
            confirm(
                'Reset all checklist progress for "' +
                worlds[currentWorldId].name +
                '"?'
            );


        if (!confirmed) {

            return;

        }


        worlds[currentWorldId].progress =
            {};


        saveWorlds();

        renderAll();

    }


    /*
     * The JSON uses:
     *
     * {
     *     "id": "...",
     *     "name": "..."
     * }
     *
     * So everything below correctly uses task.name.
     */
    function getAllTasks() {

        const tasks = [];


        for (
            const [
                sectionName,
                sectionTasks
            ] of Object.entries(
                checklist
            )
        ) {

            if (
                !Array.isArray(
                    sectionTasks
                )
            ) {

                continue;

            }


            for (
                const task of sectionTasks
            ) {

                if (
                    task &&
                    task.id &&
                    task.name
                ) {

                    tasks.push({
                        id: task.id,
                        name: task.name,
                        section: sectionName
                    });

                }

            }

        }


        return tasks;

    }


    function getWorldProgress(world) {

        const tasks =
            getAllTasks();


        let completed =
            0;


        for (
            const task of tasks
        ) {

            if (
                world.progress &&
                world.progress[
                    task.id
                ] === true
            ) {

                completed++;

            }

        }


        return {

            completed,

            total:
                tasks.length

        };

    }


    function renderWorldSelector() {

        worldSelect.innerHTML =
            "";


        Object.entries(
            worlds
        ).forEach(
            (
                [id, world]
            ) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    id;


                option.textContent =
                    world.name;


                if (
                    id ===
                    currentWorldId
                ) {

                    option.selected =
                        true;

                }


                worldSelect.appendChild(
                    option
                );

            }
        );

    }


    function renderWorldManager() {

        const worldEntries =
            Object.entries(
                worlds
            );


        worldCount.textContent =
            worldEntries.length +
            " / " +
            MAX_WORLDS +
            " worlds";


        worldGrid.innerHTML =
            "";


        worldEntries.forEach(
            (
                [id, world]
            ) => {

                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "world-card";


                if (
                    id ===
                    currentWorldId
                ) {

                    card.classList.add(
                        "current"
                    );

                }


                const progress =
                    getWorldProgress(
                        world
                    );


                const percentage =
                    progress.total === 0
                        ? 0
                        : Math.round(
                            (
                                progress.completed /
                                progress.total
                            ) *
                            100
                        );


                card.innerHTML = `
                    <h3></h3>

                    <div class="world-progress">
                        ${progress.completed}
                        /
                        ${progress.total}
                        complete
                        (${percentage}%)
                    </div>

                    <div class="world-actions">

                        <button
                            type="button"
                            class="open-world"
                        >
                            Open
                        </button>

                        <button
                            type="button"
                            class="rename-world"
                        >
                            Rename
                        </button>

                        <button
                            type="button"
                            class="delete-world"
                        >
                            Delete
                        </button>

                    </div>
                `;


                card.querySelector(
                    "h3"
                ).textContent =
                    world.name;


                card.querySelector(
                    ".open-world"
                ).addEventListener(
                    "click",
                    () => switchWorld(id)
                );


                card.querySelector(
                    ".rename-world"
                ).addEventListener(
                    "click",
                    () => renameWorld(id)
                );


                card.querySelector(
                    ".delete-world"
                ).addEventListener(
                    "click",
                    () => deleteWorld(id)
                );


                worldGrid.appendChild(
                    card
                );

            }
        );

    }


    /*
     * Opens one section and closes every other section.
     */
    function openSection(
        section
    ) {

        document
            .querySelectorAll(
                ".section.open"
            )
            .forEach(
                openSectionElement => {

                    if (
                        openSectionElement !==
                        section
                    ) {

                        openSectionElement.classList.remove(
                            "open"
                        );

                    }

                }
            );


        section.classList.add(
            "open"
        );

    }


    function toggleSection(
        section
    ) {

        const isOpen =
            section.classList.contains(
                "open"
            );


        if (isOpen) {

            section.classList.remove(
                "open"
            );

        } else {

            openSection(
                section
            );

        }

    }


    function createSection(
        sectionName,
        matchingTasks,
        world
    ) {

        const section =
            document.createElement(
                "section"
            );


        section.className =
            "section";


        /*
         * Every newly rendered section starts
         * collapsed.
         */
        section.classList.remove(
            "open"
        );


        const sectionHeader =
            document.createElement(
                "div"
            );


        sectionHeader.className =
            "section-header";


        sectionHeader.setAttribute(
            "role",
            "button"
        );


        sectionHeader.setAttribute(
            "tabindex",
            "0"
        );


        sectionHeader.setAttribute(
            "aria-expanded",
            "false"
        );


        const titleWrapper =
            document.createElement(
                "div"
            );


        titleWrapper.className =
            "section-title-wrapper";


        const arrow =
            document.createElement(
                "span"
            );


        arrow.className =
            "section-arrow";


        arrow.textContent =
            "▶";


        const title =
            document.createElement(
                "h2"
            );


        title.textContent =
            sectionName;


        titleWrapper.appendChild(
            arrow
        );


        titleWrapper.appendChild(
            title
        );


        const count =
            document.createElement(
                "span"
            );


        count.className =
            "section-count";


        const allSectionTasks =
            Array.isArray(
                checklist[
                    sectionName
                ]
            )
                ? checklist[
                    sectionName
                ]
                : [];


        const completed =
            allSectionTasks.filter(
                task =>
                    task &&
                    task.id &&
                    world.progress[
                        task.id
                    ] === true
            ).length;


        count.textContent =
            completed +
            " / " +
            allSectionTasks.length;


        sectionHeader.appendChild(
            titleWrapper
        );


        sectionHeader.appendChild(
            count
        );


        const sectionContent =
            document.createElement(
                "div"
            );


        sectionContent.className =
            "section-content";


        const sectionContentInner =
            document.createElement(
                "div"
            );


        sectionContentInner.className =
            "section-content-inner";


        const tasksContainer =
            document.createElement(
                "div"
            );


        tasksContainer.className =
            "tasks";


        matchingTasks.forEach(
            task => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "task";


                const isCompleted =
                    world.progress[
                        task.id
                    ] === true;


                if (
                    isCompleted
                ) {

                    row.classList.add(
                        "completed"
                    );

                }


                const checkbox =
                    document.createElement(
                        "input"
                    );


                checkbox.type =
                    "checkbox";


                checkbox.id =
                    "task-" +
                    task.id;


                checkbox.checked =
                    isCompleted;


                const label =
                    document.createElement(
                        "label"
                    );


                label.htmlFor =
                    checkbox.id;


                label.textContent =
                    task.name;


                checkbox.addEventListener(
                    "change",
                    event => {

                        event.stopPropagation();


                        if (
                            !world.progress
                        ) {

                            world.progress =
                                {};

                        }


                        world.progress[
                            task.id
                        ] =
                            checkbox.checked;


                        row.classList.toggle(
                            "completed",
                            checkbox.checked
                        );


                        saveWorlds();


                        updateProgress();

                        renderWorldManager();

                        updateSectionCounts();

                    }
                );


                row.appendChild(
                    checkbox
                );


                row.appendChild(
                    label
                );


                tasksContainer.appendChild(
                    row
                );

            }
        );


        sectionContentInner.appendChild(
            tasksContainer
        );


        sectionContent.appendChild(
            sectionContentInner
        );


        sectionHeader.addEventListener(
            "click",
            () => {

                toggleSection(
                    section
                );


                sectionHeader.setAttribute(
                    "aria-expanded",
                    section.classList.contains(
                        "open"
                    )
                );

            }
        );


        sectionHeader.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter" ||
                    event.key ===
                    " "
                ) {

                    event.preventDefault();


                    toggleSection(
                        section
                    );


                    sectionHeader.setAttribute(
                        "aria-expanded",
                        section.classList.contains(
                            "open"
                        )
                    );

                }

            }
        );


        section.appendChild(
            sectionHeader
        );


        section.appendChild(
            sectionContent
        );


        return section;

    }


    function renderChecklist() {

        checklistElement.innerHTML =
            "";


        const world =
            worlds[currentWorldId];


        if (!world) {

            return;

        }


        if (!world.progress) {

            world.progress =
                {};

        }


        const search =
            searchInput.value
                .trim()
                .toLowerCase();


        let visibleTasks =
            0;


        for (
            const [
                sectionName,
                tasks
            ] of Object.entries(
                checklist
            )
        ) {

            if (
                !Array.isArray(
                    tasks
                )
            ) {

                continue;

            }


            const matchingTasks =
                tasks.filter(
                    task =>
                        task &&
                        task.id &&
                        task.name &&
                        (
                            !search ||
                            task.name
                                .toLowerCase()
                                .includes(
                                    search
                                ) ||
                            sectionName
                                .toLowerCase()
                                .includes(
                                    search
                                )
                        )
                );


            if (
                matchingTasks.length === 0
            ) {

                continue;

            }


            visibleTasks +=
                matchingTasks.length;


            const section =
                createSection(
                    sectionName,
                    matchingTasks,
                    world
                );


            checklistElement.appendChild(
                section
            );

        }


        if (
            visibleTasks === 0
        ) {

            const empty =
                document.createElement(
                    "div"
                );


            empty.className =
                "empty";


            empty.textContent =
                "No checklist items match your search.";


            checklistElement.appendChild(
                empty
            );

        }


        updateProgress();

    }


    function updateProgress() {

        const world =
            worlds[currentWorldId];


        if (!world) {

            return;

        }


        const progress =
            getWorldProgress(
                world
            );


        const percentage =
            progress.total === 0
                ? 0
                : Math.round(
                    (
                        progress.completed /
                        progress.total
                    ) *
                    100
                );


        currentWorldName.textContent =
            world.name;


        overallProgress.textContent =
            progress.completed +
            " / " +
            progress.total +
            " complete";


        progressFill.style.width =
            percentage +
            "%";

    }


    function updateSectionCounts() {

        const world =
            worlds[currentWorldId];


        if (!world) {

            return;

        }


        document
            .querySelectorAll(
                ".section"
            )
            .forEach(
                section => {

                    const title =
                        section.querySelector(
                            "h2"
                        );


                    const count =
                        section.querySelector(
                            ".section-count"
                        );


                    if (
                        !title ||
                        !count
                    ) {

                        return;

                    }


                    const tasks =
                        checklist[
                            title.textContent
                        ];


                    if (
                        !Array.isArray(
                            tasks
                        )
                    ) {

                        return;

                    }


                    const completed =
                        tasks.filter(
                            task =>
                                task &&
                                task.id &&
                                world.progress[
                                    task.id
                                ] === true
                        ).length;


                    count.textContent =
                        completed +
                        " / " +
                        tasks.length;

                }
            );

    }


    function renderAll() {

        renderWorldSelector();

        renderWorldManager();

        renderChecklist();

    }


    async function loadChecklist(
        forceRender = true
    ) {

        try {

            const response =
                await fetch(
                    CHECKLIST_URL +
                    "?updated=" +
                    Date.now(),
                    {
                        cache:
                            "no-store"
                    }
                );


            if (
                !response.ok
            ) {

                throw new Error(
                    "Could not load checklist.json"
                );

            }


            const newChecklist =
                await response.json();


            if (
                !newChecklist ||
                typeof newChecklist !==
                    "object" ||
                Array.isArray(
                    newChecklist
                )
            ) {

                throw new Error(
                    "checklist.json has an invalid format."
                );

            }


            const newSignature =
                JSON.stringify(
                    newChecklist
                );


            if (
                !forceRender &&
                newSignature ===
                    checklistSignature
            ) {

                return;

            }


            checklist =
                newChecklist;


            checklistSignature =
                newSignature;


            renderAll();

        } catch (error) {

            console.error(
                "Could not load checklist.json:",
                error
            );


            if (
                Object.keys(
                    checklist
                ).length === 0
            ) {

                checklistElement.innerHTML = `
                    <div class="empty">
                        Could not load checklist.json.
                        Make sure it is in the same folder as index.html.
                    </div>
                `;

            }

        }

    }


    worldSelect.addEventListener(
        "change",
        event => {

            switchWorld(
                event.target.value
            );

        }
    );


    newWorldButton.addEventListener(
        "click",
        createWorld
    );


    resetButton.addEventListener(
        "click",
        resetCurrentWorld
    );


    searchInput.addEventListener(
        "input",
        renderChecklist
    );


    window.addEventListener(
        "storage",
        event => {

            if (
                event.key ===
                    WORLDS_STORAGE_KEY ||
                event.key ===
                    CURRENT_WORLD_STORAGE_KEY
            ) {

                loadWorlds();

                renderAll();

            }

        }
    );


    loadWorlds();

    renderAll();

    loadChecklist(
        true
    );


    setInterval(
        () => {

            loadChecklist(
                false
            );

        },
        JSON_CHECK_INTERVAL
    );

</script>

</body>
</html>
