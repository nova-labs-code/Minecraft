<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#0b120d"
    >

    <title>Minecraft Survival To-Do</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            background: #0b120d;
            color: #e8f0e8;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #17251a 0%,
                    #0b120d 45%,
                    #070b08 100%
                );
            color: #e8f0e8;
            -webkit-text-size-adjust: 100%;
            overscroll-behavior: none;
        }

        button,
        .search-box,
        .world-search-box,
        .day-editor-value,
        .name-editor-value {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding:
                max(24px, env(safe-area-inset-top))
                16px
                max(30px, env(safe-area-inset-bottom));
        }

        .header {
            padding: 20px 0 24px;
        }

        .title {
            margin: 0;
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            margin: 7px 0 0;
            color: #93a397;
            font-size: 14px;
        }

        .panel {
            background: rgba(17, 25, 19, 0.92);
            border: 1px solid #253428;
            border-radius: 16px;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.025);
        }

        /* ---------------- WORLD MANAGER ---------------- */

        .world-panel {
            padding: 16px;
            margin-bottom: 16px;
        }

        .panel-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .panel-title {
            margin: 0;
            font-size: 18px;
            font-weight: 750;
        }

        .world-count {
            color: #7e8d81;
            font-size: 12px;
            white-space: nowrap;
        }

        .world-search-box,
        .search-box {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            border-radius: 11px;
            border: 1px solid #2a3a2d;
            background: #0c130e;
            color: #e8f0e8;
            outline: none;
            line-height: 20px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            caret-color: #77c47f;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
        }

        .world-search-box:focus,
        .search-box:focus,
        .day-editor-value:focus,
        .name-editor-value:focus {
            border-color: #4b8d53;
            box-shadow: 0 0 0 3px rgba(75, 141, 83, 0.12);
        }

        .world-search-box:empty::before,
        .search-box:empty::before {
            content: attr(data-placeholder);
            color: #637166;
            pointer-events: none;
        }

        .worlds {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 2px 2px 12px;
            margin-top: 12px;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
        }

        .worlds::-webkit-scrollbar {
            height: 6px;
        }

        .worlds::-webkit-scrollbar-track {
            background: transparent;
        }

        .worlds::-webkit-scrollbar-thumb {
            background: #29382c;
            border-radius: 999px;
        }

        .world-card {
            flex: 0 0 190px;
            min-width: 190px;
            padding: 14px;
            border-radius: 13px;
            border: 1px solid #29372c;
            background: #101811;
            cursor: pointer;
            scroll-snap-align: start;
            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .world-card:active {
            transform: scale(0.98);
        }

        .world-card.current {
            border-color: #4d8d55;
            background: #132017;
        }

        .world-name {
            font-weight: 750;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .world-meta {
            margin-top: 7px;
            color: #829087;
            font-size: 12px;
            line-height: 1.55;
        }

        .world-current {
            display: inline-block;
            margin-top: 9px;
            padding: 4px 7px;
            border-radius: 6px;
            background: #1b3420;
            color: #8bd291;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .world-empty {
            width: 100%;
            padding: 18px 8px;
            color: #718076;
            text-align: center;
            font-size: 13px;
        }

        .world-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }

        .action-button {
            min-height: 40px;
            padding: 9px 13px;
            border-radius: 9px;
            border: 1px solid #304133;
            background: #172219;
            color: #dce8dd;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.1s ease;
        }

        .action-button:hover {
            background: #1c2b1f;
            border-color: #46614a;
        }

        .action-button:active {
            transform: scale(0.97);
        }

        .action-button.primary {
            background: #204927;
            border-color: #356b3d;
            color: #dff4e1;
        }

        .action-button.primary:hover {
            background: #285a30;
        }

        .action-button.danger {
            background: #2a1717;
            border-color: #5a2b2b;
            color: #efcaca;
        }

        .action-button.danger:hover {
            background: #351b1b;
        }

        /* ---------------- DAY TRACKER ---------------- */

        .day-tracker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 11px;
            background: #0d150f;
            border: 1px solid #253329;
        }

        .day-label {
            color: #aebbb0;
            font-size: 13px;
            font-weight: 650;
        }

        .day-controls {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .day-button,
        .day-display {
            border: 1px solid #304233;
            background: #172219;
            color: #dfe9e0;
            min-height: 38px;
            border-radius: 9px;
            cursor: pointer;
        }

        .day-button {
            width: 38px;
            font-size: 21px;
            line-height: 1;
        }

        .day-display {
            min-width: 90px;
            padding: 7px 12px;
            font-size: 13px;
            font-weight: 700;
        }

        .day-button:active,
        .day-display:active {
            transform: scale(0.97);
        }

        /* ---------------- CHECKLIST ---------------- */

        .progress-panel {
            padding: 16px;
            margin-bottom: 16px;
        }

        .progress-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .progress-label {
            font-size: 13px;
            color: #aab6ad;
        }

        .progress-number {
            font-size: 13px;
            color: #dce8dd;
            font-weight: 700;
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: #1a251c;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #4d9556;
            border-radius: inherit;
            transition: width 0.25s ease;
        }

        .search-panel {
            margin-bottom: 16px;
        }

        .section {
            border: 1px solid #263529;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(15, 22, 17, 0.9);
            margin-bottom: 10px;
        }

        .section-header {
            width: 100%;
            min-height: 58px;
            padding: 13px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 0;
            background: transparent;
            color: #e3ece4;
            text-align: left;
            cursor: pointer;
        }

        .section-header:active {
            background: #121b14;
        }

        .section-arrow {
            width: 18px;
            flex: 0 0 18px;
            color: #7fa885;
            transition: transform 0.2s ease;
        }

        .section.open .section-arrow {
            transform: rotate(90deg);
        }

        .section-title {
            flex: 1;
            min-width: 0;
            font-size: 15px;
            font-weight: 750;
        }

        .section-count {
            color: #748278;
            font-size: 12px;
            white-space: nowrap;
        }

        .section-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.22s ease;
        }

        .section.open .section-body {
            grid-template-rows: 1fr;
        }

        .section-inner {
            min-height: 0;
            overflow: hidden;
        }

        .tasks {
            padding: 0 10px 10px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 11px;
            min-height: 48px;
            padding: 8px 9px;
            border-radius: 9px;
            animation: taskIn 0.18s ease both;
        }

        .task + .task {
            margin-top: 2px;
        }

        .task:hover {
            background: #111a13;
        }

        .task-check {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
            margin: 0;
            border-radius: 5px;
            border: 1px solid #4a5d4c;
            background: #0c130e;
            cursor: pointer;
            position: relative;
        }

        .task-check:checked {
            background: #397241;
            border-color: #5b9e64;
        }

        .task-check:checked::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            transform: rotate(45deg);
        }

        .task-label {
            min-width: 0;
            flex: 1;
            color: #d3ded4;
            font-size: 14px;
            line-height: 1.4;
            cursor: pointer;
        }

        .task.completed .task-label {
            color: #718078;
            text-decoration: line-through;
            text-decoration-thickness: 1px;
        }

        .empty-state {
            padding: 30px 15px;
            text-align: center;
            color: #718076;
            font-size: 13px;
        }

        /* ---------------- MODALS ---------------- */

        .modal-layer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding:
                max(20px, env(safe-area-inset-top))
                20px
                max(20px, env(safe-area-inset-bottom));
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(5px);
        }

        .modal-layer.visible {
            display: flex;
        }

        .modal {
            width: min(420px, 100%);
            padding: 18px;
            border: 1px solid #304033;
            border-radius: 15px;
            background: #111912;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
            animation: modalIn 0.16s ease;
        }

        .modal-title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 750;
        }

        .modal-message {
            margin: 0;
            color: #94a197;
            font-size: 13px;
            line-height: 1.5;
        }

        .name-editor-value,
        .day-editor-value {
            min-height: 45px;
            width: 100%;
            margin-top: 14px;
            padding: 11px 13px;
            border: 1px solid #304133;
            border-radius: 10px;
            background: #0b120d;
            color: #e8f0e8;
            outline: none;
            white-space: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            line-height: 21px;
            caret-color: #77c47f;
            -webkit-user-select: text;
            user-select: text;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 14px;
        }

        /* ---------------- TOAST ---------------- */

        .toast {
            position: fixed;
            left: 50%;
            bottom: max(22px, env(safe-area-inset-bottom));
            z-index: 2000;
            transform: translate(-50%, 20px);
            padding: 10px 14px;
            border: 1px solid #304033;
            border-radius: 10px;
            background: #172119;
            color: #dce8de;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition:
                opacity 0.18s ease,
                transform 0.18s ease;
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        @keyframes taskIn {
            from {
                opacity: 0;
                transform: translateY(-3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @media (max-width: 600px) {
            .app {
                padding-left: 12px;
                padding-right: 12px;
            }

            .world-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .action-button {
                width: 100%;
            }

            .day-tracker {
                align-items: flex-start;
                flex-direction: column;
            }

            .day-controls {
                width: 100%;
            }

            .day-display {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <h1 class="title">Minecraft Survival To-Do</h1>
        <p class="subtitle">
            Track your survival worlds and everything you want to accomplish.
        </p>
    </header>

    <section class="panel world-panel">

        <div class="panel-title-row">
            <h2 class="panel-title">Worlds</h2>

            <span
                class="world-count"
                id="worldCount"
            >
                0 / 100
            </span>
        </div>

        <div
            class="world-search-box"
            id="worldSearchBox"
            contenteditable="true"
            role="searchbox"
            aria-label="Search worlds"
            data-placeholder="Search worlds..."
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
        ></div>

        <div
            class="worlds"
            id="worlds"
        ></div>

        <div class="world-actions">

            <button
                type="button"
                class="action-button primary"
                id="newWorld"
            >
                + New World
            </button>

            <button
                type="button"
                class="action-button"
                id="renameWorld"
            >
                Rename World
            </button>

            <button
                type="button"
                class="action-button danger"
                id="deleteWorld"
            >
                Delete World
            </button>

            <button
                type="button"
                class="action-button"
                id="resetWorld"
            >
                Reset Current World
            </button>

        </div>

        <section class="day-tracker">

            <span class="day-label">
                Minecraft Day
            </span>

            <div class="day-controls">

                <button
                    type="button"
                    class="day-button"
                    id="dayMinus"
                    aria-label="Decrease Minecraft day"
                >
                    −
                </button>

                <button
                    type="button"
                    class="day-display"
                    id="minecraftDay"
                    aria-label="Edit Minecraft day"
                >
                    Day 1
                </button>

                <button
                    type="button"
                    class="day-button"
                    id="dayPlus"
                    aria-label="Increase Minecraft day"
                >
                    +
                </button>

            </div>

        </section>

    </section>

    <section class="panel progress-panel">

        <div class="progress-top">

            <span class="progress-label">
                Current World Progress
            </span>

            <span
                class="progress-number"
                id="progressNumber"
            >
                0 / 0
            </span>

        </div>

        <div class="progress-track">
            <div
                class="progress-fill"
                id="progressFill"
            ></div>
        </div>

    </section>

    <section class="panel search-panel">

        <div
            class="search-box"
            id="searchBox"
            contenteditable="true"
            role="searchbox"
            aria-label="Search checklist"
            data-placeholder="Search checklist..."
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off"
        ></div>

    </section>

    <main id="checklist"></main>

</div>

<div
    class="modal-layer"
    id="modalLayer"
>
    <div
        class="modal"
        id="modal"
    ></div>
</div>

<div
    class="toast"
    id="toast"
></div>

<script>
    "use strict";

    /*
        ------------------------------------------------------------
        STORAGE
        ------------------------------------------------------------
    */

    const WORLDS_STORAGE_KEY =
        "minecraft-survival-todo-worlds";

    const CURRENT_WORLD_STORAGE_KEY =
        "minecraft-survival-todo-worlds-current";

    const CHECKLIST_URL =
        "checklist.json";

    const MAX_WORLDS = 100;

    const CHECKLIST_POLL_INTERVAL = 2000;


    /*
        ------------------------------------------------------------
        ELEMENTS
        ------------------------------------------------------------
    */

    const worldsElement =
        document.getElementById("worlds");

    const worldCountElement =
        document.getElementById("worldCount");

    const worldSearchBox =
        document.getElementById("worldSearchBox");

    const checklistElement =
        document.getElementById("checklist");

    const searchBox =
        document.getElementById("searchBox");

    const progressNumber =
        document.getElementById("progressNumber");

    const progressFill =
        document.getElementById("progressFill");

    const newWorldButton =
        document.getElementById("newWorld");

    const renameWorldButton =
        document.getElementById("renameWorld");

    const deleteWorldButton =
        document.getElementById("deleteWorld");

    const resetWorldButton =
        document.getElementById("resetWorld");

    const dayMinusButton =
        document.getElementById("dayMinus");

    const dayPlusButton =
        document.getElementById("dayPlus");

    const minecraftDay =
        document.getElementById("minecraftDay");

    const modalLayer =
        document.getElementById("modalLayer");

    const modal =
        document.getElementById("modal");

    const toast =
        document.getElementById("toast");


    /*
        ------------------------------------------------------------
        STATE
        ------------------------------------------------------------
    */

    let worlds = [];

    let currentWorldId = null;

    let checklist = {};

    let checklistSignature = "";

    let toastTimer = null;


    /*
        ------------------------------------------------------------
        BASIC HELPERS
        ------------------------------------------------------------
    */

    function createId() {
        return (
            Date.now().toString(36) +
            Math.random().toString(36).slice(2, 9)
        );
    }


    function escapeHTML(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function getCurrentWorld() {
        return worlds.find(
            world => world.id === currentWorldId
        ) || null;
    }


    function getAllTasks() {
        const tasks = [];

        for (const sectionName of Object.keys(checklist)) {

            const sectionTasks =
                Array.isArray(checklist[sectionName])
                    ? checklist[sectionName]
                    : [];

            for (const task of sectionTasks) {
                tasks.push(task);
            }
        }

        return tasks;
    }


    function getTotalTaskCount() {
        return getAllTasks().length;
    }


    function getCompletedTaskCount(world) {

        if (!world) {
            return 0;
        }

        let count = 0;

        for (const task of getAllTasks()) {

            if (
                world.progress &&
                world.progress[task.id] === true
            ) {
                count++;
            }
        }

        return count;
    }


    /*
        ------------------------------------------------------------
        WORLD STORAGE
        ------------------------------------------------------------
    */

    function saveWorlds() {

        localStorage.setItem(
            WORLDS_STORAGE_KEY,
            JSON.stringify(worlds)
        );

        localStorage.setItem(
            CURRENT_WORLD_STORAGE_KEY,
            String(currentWorldId)
        );
    }


    function loadWorlds() {

        try {

            const savedWorlds =
                JSON.parse(
                    localStorage.getItem(
                        WORLDS_STORAGE_KEY
                    )
                );

            if (Array.isArray(savedWorlds)) {
                worlds = savedWorlds;
            }

        } catch {
            worlds = [];
        }


        worlds = worlds
            .filter(world =>
                world &&
                typeof world === "object" &&
                typeof world.id === "string"
            )
            .slice(0, MAX_WORLDS);


        for (const world of worlds) {

            if (
                !world.progress ||
                typeof world.progress !== "object"
            ) {
                world.progress = {};
            }

            if (
                !Number.isInteger(world.day) ||
                world.day < 1
            ) {
                world.day = 1;
            }

            if (
                typeof world.name !== "string" ||
                !world.name.trim()
            ) {
                world.name = "Unnamed World";
            }
        }


        const savedCurrentWorld =
            localStorage.getItem(
                CURRENT_WORLD_STORAGE_KEY
            );


        if (
            savedCurrentWorld &&
            worlds.some(
                world =>
                    world.id === savedCurrentWorld
            )
        ) {
            currentWorldId =
                savedCurrentWorld;

        } else if (worlds.length > 0) {

            currentWorldId =
                worlds[0].id;

        } else {

            const world =
                createWorld("World 1");

            worlds.push(world);

            currentWorldId =
                world.id;
        }


        saveWorlds();
    }


    function createWorld(name) {

        return {
            id: createId(),
            name: name,
            progress: {},
            day: 1
        };
    }


    /*
        ------------------------------------------------------------
        WORLD SEARCH
        ------------------------------------------------------------
    */

    function getWorldSearchText() {

        return worldSearchBox
            .textContent
            .trim()
            .toLowerCase();
    }


    /*
        ------------------------------------------------------------
        RENDER WORLDS
        ------------------------------------------------------------
    */

    function renderWorlds() {

        const search =
            getWorldSearchText();

        const filteredWorlds =
            worlds.filter(world => {

                if (!search) {
                    return true;
                }

                return world.name
                    .toLowerCase()
                    .includes(search);
            });


        worldsElement.innerHTML = "";


        worldCountElement.textContent =
            search
                ? `${filteredWorlds.length} shown / ${worlds.length}`
                : `${worlds.length} / ${MAX_WORLDS}`;


        if (filteredWorlds.length === 0) {

            worldsElement.innerHTML =
                `
                <div class="world-empty">
                    No worlds match your search.
                </div>
                `;

            return;
        }


        for (const world of filteredWorlds) {

            const completed =
                getCompletedTaskCount(world);

            const total =
                getTotalTaskCount();


            const card =
                document.createElement("div");

            card.className =
                "world-card" +
                (
                    world.id === currentWorldId
                        ? " current"
                        : ""
                );


            card.dataset.worldId =
                world.id;


            card.innerHTML =
                `
                <div class="world-name">
                    ${escapeHTML(world.name)}
                </div>

                <div class="world-meta">
                    ${completed} / ${total} tasks complete
                    <br>
                    Minecraft Day ${world.day}
                </div>

                ${
                    world.id === currentWorldId
                        ? `
                            <span class="world-current">
                                Current World
                            </span>
                        `
                        : ""
                }
                `;


            card.addEventListener(
                "click",
                () => {

                    currentWorldId =
                        world.id;

                    saveWorlds();

                    renderWorlds();
                    renderChecklist();
                    updateDayDisplay();
                }
            );


            worldsElement.appendChild(card);
        }
    }


    /*
        ------------------------------------------------------------
        DAY TRACKER
        ------------------------------------------------------------
    */

    function getCurrentDay() {

        const world =
            getCurrentWorld();

        if (!world) {
            return 1;
        }

        return world.day;
    }


    function setCurrentDay(day) {

        const world =
            getCurrentWorld();

        if (!world) {
            return;
        }

        world.day =
            Math.max(
                1,
                Math.floor(Number(day) || 1)
            );


        saveWorlds();

        updateDayDisplay();
        renderWorlds();
    }


    function updateDayDisplay() {

        minecraftDay.textContent =
            `Day ${getCurrentDay()}`;

    /*
        ------------------------------------------------------------
        CHECKLIST PROGRESS
        ------------------------------------------------------------
    */

    function updateProgress() {

        const world =
            getCurrentWorld();

        const total =
            getTotalTaskCount();

        const completed =
            getCompletedTaskCount(world);


        progressNumber.textContent =
            `${completed} / ${total}`;


        const percentage =
            total > 0
                ? (completed / total) * 100
                : 0;


        progressFill.style.width =
            `${percentage}%`;
    }


    function updateSectionCounts() {

        const world =
            getCurrentWorld();


        document
            .querySelectorAll(".section")
            .forEach(section => {

                const sectionName =
                    section.dataset.section;


                const tasks =
                    Array.isArray(
                        checklist[sectionName]
                    )
                        ? checklist[sectionName]
                        : [];


                let completed = 0;


                for (const task of tasks) {

                    if (
                        world &&
                        world.progress &&
                        world.progress[task.id] === true
                    ) {
                        completed++;
                    }
                }


                const count =
                    section.querySelector(
                        ".section-count"
                    );


                if (count) {

                    count.textContent =
                        `${completed} / ${tasks.length}`;
                }
            });
    }


    function updateSectionCount(
        sectionElement,
        sectionName
    ) {

        const world =
            getCurrentWorld();


        const tasks =
            Array.isArray(
                checklist[sectionName]
            )
                ? checklist[sectionName]
                : [];


        let completed = 0;


        for (const task of tasks) {

            if (
                world &&
                world.progress &&
                world.progress[task.id] === true
            ) {
                completed++;
            }
        }


        const count =
            sectionElement.querySelector(
                ".section-count"
            );


        if (count) {

            count.textContent =
                `${completed} / ${tasks.length}`;
        }
    }


    /*
        ------------------------------------------------------------
        TASK ROW
        ------------------------------------------------------------
    */

    function createTaskElement(
        sectionName,
        task,
        delay = 0
    ) {

        const world =
            getCurrentWorld();


        const taskElement =
            document.createElement("div");


        taskElement.className =
            "task";


        taskElement.dataset.taskId =
            task.id;


        if (
            world &&
            world.progress &&
            world.progress[task.id] === true
        ) {
            taskElement.classList.add(
                "completed"
            );
        }


        taskElement.style.animationDelay =
            `${delay}ms`;


        const checkbox =
            document.createElement("input");


        checkbox.type =
            "checkbox";


        checkbox.className =
            "task-check";


        checkbox.checked =
            Boolean(
                world &&
                world.progress &&
                world.progress[task.id]
            );


        checkbox.addEventListener(
            "change",
            () => {

                const currentWorld =
                    getCurrentWorld();

                if (!currentWorld) {
                    return;
                }


                if (!currentWorld.progress) {
                    currentWorld.progress = {};
                }


                currentWorld.progress[task.id] =
                    checkbox.checked;


                taskElement.classList.toggle(
                    "completed",
                    checkbox.checked
                );


                saveWorlds();

                updateProgress();
                updateSectionCounts();
                renderWorlds();
            }
        );


        const label =
            document.createElement("label");


        label.className =
            "task-label";


        label.textContent =
            task.name;


        label.addEventListener(
            "click",
            () => {
                checkbox.click();
            }
        );


        taskElement.appendChild(
            checkbox
        );

        taskElement.appendChild(
            label
        );


        return taskElement;
    }


    /*
        ------------------------------------------------------------
        SECTION ELEMENT
        ------------------------------------------------------------
    */

    function createSectionElement(
        sectionName,
        tasks
    ) {

        const section =
            document.createElement("section");


        section.className =
            "section";


        section.dataset.section =
            sectionName;


        const header =
            document.createElement("button");


        header.type =
            "button";


        header.className =
            "section-header";


        header.innerHTML =
            `
            <span class="section-arrow">
                ›
            </span>

            <span class="section-title">
                ${escapeHTML(sectionName)}
            </span>

            <span class="section-count">
                0 / ${tasks.length}
            </span>
            `;


        const body =
            document.createElement("div");


        body.className =
            "section-body";


        const inner =
            document.createElement("div");


        inner.className =
            "section-inner";


        const tasksElement =
            document.createElement("div");


        tasksElement.className =
            "tasks";


        tasks.forEach(
            (task, index) => {

                tasksElement.appendChild(
                    createTaskElement(
                        sectionName,
                        task,
                        index * 18
                    )
                );
            }
        );


        inner.appendChild(
            tasksElement
        );

        body.appendChild(
            inner
        );


        section.appendChild(
            header
        );

        section.appendChild(
            body
        );


        header.addEventListener(
            "click",
            () => {

                const wasOpen =
                    section.classList.contains(
                        "open"
                    );


                document
                    .querySelectorAll(
                        ".section.open"
                    )
                    .forEach(openSection => {

                        openSection.classList.remove(
                            "open"
                        );
                    });


                if (!wasOpen) {

                    section.classList.add(
                        "open"
                    );
                }
            }
        );


        updateSectionCount(
            section,
            sectionName
        );


        return section;
    }


    /*
        ------------------------------------------------------------
        FULL CHECKLIST RENDER
        ------------------------------------------------------------
    */

    function renderChecklist() {

        const search =
            searchBox
                .textContent
                .trim()
                .toLowerCase();


        checklistElement.innerHTML = "";


        let sectionCount = 0;


        for (
            const sectionName
            of Object.keys(checklist)
        ) {

            const originalTasks =
                Array.isArray(
                    checklist[sectionName]
                )
                    ? checklist[sectionName]
                    : [];


            const visibleTasks =
                search
                    ? originalTasks.filter(task =>
                        String(task.name || "")
                            .toLowerCase()
                            .includes(search)
                    )
                    : originalTasks;


            if (
                search &&
                visibleTasks.length === 0
            ) {
                continue;
            }


            const section =
                createSectionElement(
                    sectionName,
                    visibleTasks
                );


            checklistElement.appendChild(
                section
            );


            sectionCount++;
        }


        if (sectionCount === 0) {

            checklistElement.innerHTML =
                `
                <div class="empty-state">
                    No checklist items match your search.
                </div>
                `;
        }


        updateProgress();
        updateSectionCounts();
    }


    /*
        ------------------------------------------------------------
        INCREMENTAL CHECKLIST UPDATE
        ------------------------------------------------------------
    */

    function updateChecklistDOM() {

        /*
            When searching, the visible checklist is dependent
            on the search text, so rebuilding is safe here.
        */

        if (
            searchBox
                .textContent
                .trim()
        ) {
            renderChecklist();
            return;
        }


        const existingSections =
            new Map();


        document
            .querySelectorAll(".section")
            .forEach(section => {

                existingSections.set(
                    section.dataset.section,
                    section
                );
            });


        /*
            Remove sections that no longer exist.
        */

        for (
            const [sectionName, sectionElement]
            of existingSections
        ) {

            if (
                !Object.prototype.hasOwnProperty.call(
                    checklist,
                    sectionName
                )
            ) {

                sectionElement.remove();
            }
        }


        /*
            Add/update sections.
        */

        for (
            const sectionName
            of Object.keys(checklist)
        ) {

            const tasks =
                Array.isArray(
                    checklist[sectionName]
                )
                    ? checklist[sectionName]
                    : [];


            let section =
                document.querySelector(
                    `.section[data-section="${CSS.escape(sectionName)}"]`
                );


            if (!section) {

                section =
                    createSectionElement(
                        sectionName,
                        tasks
                    );


                checklistElement.appendChild(
                    section
                );


                continue;
            }


            const taskContainer =
                section.querySelector(
                    ".tasks"
                );


            const existingTasks =
                new Map();


            taskContainer
                .querySelectorAll(".task")
                .forEach(taskElement => {

                    existingTasks.set(
                        taskElement.dataset.taskId,
                        taskElement
                    );
                });


            const newTaskIds =
                new Set(
                    tasks.map(
                        task => task.id
                    )
                );


            /*
                Remove deleted tasks.
            */

            for (
                const [taskId, taskElement]
                of existingTasks
            ) {

                if (
                    !newTaskIds.has(taskId)
                ) {

                    taskElement.remove();
                }
            }


            /*
                Add new tasks.
            */

            for (const task of tasks) {

                const existing =
                    taskContainer.querySelector(
                        `.task[data-task-id="${CSS.escape(task.id)}"]`
                    );


                if (!existing) {

                    taskContainer.appendChild(
                        createTaskElement(
                            sectionName,
                            task
                        )
                    );

                    continue;
                }


                /*
                    If an existing task was renamed,
                    update its text without replacing
                    the row.
                */

                const label =
                    existing.querySelector(
                        ".task-label"
                    );


                if (
                    label &&
                    label.textContent !== task.name
                ) {

                    label.textContent =
                        task.name;
                }


                const world =
                    getCurrentWorld();


                const shouldBeChecked =
                    Boolean(
                        world &&
                        world.progress &&
                        world.progress[task.id]
                    );


                const checkbox =
                    existing.querySelector(
                        ".task-check"
                    );


                if (
                    checkbox &&
                    checkbox.checked !== shouldBeChecked
                ) {

                    checkbox.checked =
                        shouldBeChecked;

                    existing.classList.toggle(
                        "completed",
                        shouldBeChecked
                    );
                }
            }


            updateSectionCount(
                section,
                sectionName
            );
        }


        updateProgress();
        updateSectionCounts();
    }


    /*
        ------------------------------------------------------------
        CLEAN REMOVED TASK PROGRESS
        ------------------------------------------------------------
    */

    function cleanRemovedTaskProgress(
        newChecklist
    ) {

        const validTaskIds =
            new Set();


        for (
            const sectionName
            of Object.keys(newChecklist)
        ) {

            const tasks =
                Array.isArray(
                    newChecklist[sectionName]
                )
                    ? newChecklist[sectionName]
                    : [];


            for (const task of tasks) {

                if (
                    task &&
                    typeof task.id === "string"
                ) {

                    validTaskIds.add(
                        task.id
                    );
                }
            }
        }


        let changed = false;


        for (const world of worlds) {

            if (!world.progress) {
                world.progress = {};
            }


            for (
                const taskId
                of Object.keys(world.progress)
            ) {

                if (
                    !validTaskIds.has(taskId)
                ) {

                    delete world.progress[taskId];

                    changed = true;
                }
            }
        }


        if (changed) {
            saveWorlds();
        }
    }


    /*
        ------------------------------------------------------------
        CHECKLIST LOADING
        ------------------------------------------------------------
    */

    function makeChecklistSignature(
        data
    ) {

        return JSON.stringify(data);
    }


    async function loadChecklist(
        forceRender = true
    ) {

        try {

            const response =
                await fetch(
                    `${CHECKLIST_URL}?t=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                throw new Error(
                    "Checklist request failed."
                );
            }


            const data =
                await response.json();


            if (
                !data ||
                typeof data !== "object" ||
                Array.isArray(data)
            ) {
                throw new Error(
                    "Invalid checklist format."
                );
            }


            const newSignature =
                makeChecklistSignature(data);


            if (
                newSignature ===
                checklistSignature
            ) {
                return;
            }


            const oldChecklist =
                checklist;


            checklist =
                data;


            checklistSignature =
                newSignature;


            cleanRemovedTaskProgress(
                checklist
            );


            /*
                First load.
            */

            if (
                Object.keys(oldChecklist).length === 0
            ) {

                if (forceRender) {
                    renderChecklist();
                }

                renderWorlds();
                updateDayDisplay();

                return;
            }


            /*
                Later updates use the incremental
                renderer so open sections remain open.
            */

            updateChecklistDOM();

            renderWorlds();
            updateDayDisplay();

        } catch {

            if (
                Object.keys(checklist).length === 0
            ) {

                checklistElement.innerHTML =
                    `
                    <div class="empty-state">
                        Unable to load checklist.json.
                    </div>
                    `;
            }
        }
    }


    /*
        ------------------------------------------------------------
        SEARCH
        ------------------------------------------------------------
    */

    function setupSearchPlaceholder(
        element
    ) {

        /*
            contenteditable already gives us normal browser
            text selection and caret placement.

            We only need to prevent accidental line breaks.
        */

        element.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();
                }
            }
        );


        /*
            Prevent pasting formatted HTML.
            Only plain text is inserted.
        */

        element.addEventListener(
            "paste",
            event => {

                event.preventDefault();


                const text =
                    (
                        event.clipboardData ||
                        window.clipboardData
                    ).getData("text/plain");


                document.execCommand(
                    "insertText",
                    false,
                    text.replace(
                        /[\r\n]+/g,
                        " "
                    )
                );
            }
        );
    }


    setupSearchPlaceholder(
        searchBox
    );

    setupSearchPlaceholder(
        worldSearchBox
    );


    searchBox.addEventListener(
        "input",
        () => {
            renderChecklist();
        }
    );


    worldSearchBox.addEventListener(
        "input",

        }
    );


    /*
        ------------------------------------------------------------
        CUSTOM TEXT EDITOR HELPERS
        ------------------------------------------------------------
    */

    function getEditableText(
        element
    ) {

        return element
            .textContent
            .replace(/[\r\n]+/g, " ")
            .trim();
    }


    function setEditableText(
        element,
        text
    ) {

        element.textContent =
            String(text ?? "");


        /*
            Put the caret at the end initially.
            After that, normal clicking works normally.
        */

        placeCaretAtEnd(element);
    }


    function placeCaretAtEnd(
        element
    ) {

        element.focus();


        const selection =
            window.getSelection();


        const range =
            document.createRange();


        range.selectNodeContents(
            element
        );


        range.collapse(false);


        selection.removeAllRanges();

        selection.addRange(range);
    }


    /*
        Clicking inside a contenteditable element naturally places
        the caret exactly where the user clicked.

        Double-clicking naturally performs the browser's classic
        word selection.

        We deliberately DO NOT replace the selection or caret on
        every click, because doing that would break normal editing.
    */

                currentWorldId =

    );

    /*
        ------------------------------------------------------------
        DAY EDITOR
        ------------------------------------------------------------
    */

    function createDayEditor(
        currentDay
    ) {

        modal.innerHTML =
            `
            <h2 class="modal-title">
                Minecraft Day
            </h2>

            <p class="modal-message">
                Enter the Minecraft day for this world.
            </p>

            <div
                class="day-editor-value"
                id="dayEditorValue"
                contenteditable="true"
                role="textbox"
                aria-label="Minecraft day"
                inputmode="numeric"
                spellcheck="false"
            ></div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="action-button"
                    id="dayCancel"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="action-button primary"
                    id="daySave"
                >
                    Save
                </button>

            </div>
            `;


        modalLayer.classList.add(
            "visible"
        );


        const editor =
            document.getElementById(
                "dayEditorValue"
            );


        editor.textContent =
            String(currentDay);


        editor.focus();

        placeCaretAtEnd(
            editor
        );


        editor.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter"
                ) {

                    event.preventDefault();

                    saveDayEditor();
                }


                if (
                    event.key === "Escape"
                ) {

                    event.preventDefault();

                    closeModal();
                }
            }
        );


        document
            .getElementById("dayCancel")
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById("daySave")
            .addEventListener(
                "click",
                saveDayEditor
            );


        function saveDayEditor() {

            const raw =
                getEditableText(
                    editor
                );


            const day =
                Number(
                    raw.replace(
                        /[^0-9]/g,
                        ""
                    )
                );


            if (
                !Number.isFinite(day) ||
                day < 1
            ) {

                showMessage(
                    "Enter a valid Minecraft day."
                );

                return;
            }


            setCurrentDay(
                day
            );


            closeModal();
        }
    }


    /*
        ------------------------------------------------------------
        CUSTOM WORLD NAME EDITOR
        ------------------------------------------------------------
    */

    function createCustomNameEditor(
        currentName,
        title,
        message
    ) {

        return new Promise(
            resolve => {

                let finished = false;


                modal.innerHTML =
                    `
                    <h2 class="modal-title">
                        ${escapeHTML(title)}
                    </h2>

                    <p class="modal-message">
                        ${escapeHTML(message)}
                    </p>

                    <div
                        class="name-editor-value"
                        id="nameEditorValue"
                        contenteditable="true"
                        role="textbox"
                        aria-label="World name"
                        spellcheck="false"
                        autocapitalize="off"
                        autocomplete="off"
                        autocorrect="off"
                    ></div>

                    <div class="modal-actions">

                        <button
                            type="button"
                            class="action-button"
                            id="nameCancel"
                        >
                            Cancel
                        </button>

                        <button
                            type="button"
                            class="action-button primary"
                            id="nameSave"
                        >
                            Save
                        </button>

                    </div>
                    `;


                modalLayer.classList.add(
                    "visible"
                );


                const editor =
                    document.getElementById(
                        "nameEditorValue"
                    );


                editor.textContent =
                    currentName;


                editor.focus();


                /*
                    Select the existing name so typing immediately
                    replaces it, while normal clicks can still put
                    the caret anywhere and double-click still selects
                    individual words.
                */

                const selection =
                    window.getSelection();


                const range =
                    document.createRange();


                range.selectNodeContents(
                    editor
                );


                selection.removeAllRanges();

                selection.addRange(range);


                function finish(
                    value
                ) {

                    if (finished) {
                        return;
                    }


                    finished = true;

                    closeModal();

                    resolve(value);
                }


                function save() {

                    finish(
                        getEditableText(
                            editor
                        )
                    );
                }


                function cancel() {

                    finish(null);
                }


                editor.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key === "Enter"
                        ) {

                            event.preventDefault();

                            save();
                        }


                        if (
                            event.key === "Escape"
                        ) {

                            event.preventDefault();

                            cancel();
                        }
                    }
                );


                document
                    .getElementById("nameCancel")
                    .addEventListener(
                        "click",
                        cancel
                    );


                document
                    .getElementById("nameSave")
                    .addEventListener(
                        "click",
                        save
                    );
            }
        );
    }

                    class="action-button"
                    id="deleteCancel"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="action-button danger"
                    id="deleteConfirm"
                >
                    Delete
                </button>

            </div>
            `;


        modalLayer.classList.add(
            "visible"
        );


        document
            .getElementById("deleteCancel")
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById("deleteConfirm")
            .addEventListener(
                "click",
                () => {

                    if (worlds.length <= 1) {

                        showMessage(
                            "You need to keep at least one world."
                        );

                        closeModal();

                        return;
                    }


                    worlds =
                        worlds.filter(
                            item =>
                                item.id !== world.id
                        );


                    if (
                        currentWorldId ===
                        world.id
                    ) {

                        currentWorldId =
                            worlds[0].id;
                    }


                    saveWorlds();

                    closeModal();

                    renderWorlds();
                    renderChecklist();
                    updateDayDisplay();
                }
            );
    }


    /*
        ------------------------------------------------------------
        RESET UI
        ------------------------------------------------------------
    */

    function showResetUI(
        world
    ) {

        modal.innerHTML =
            `
            <h2 class="modal-title">
                Reset World
            </h2>

            <p class="modal-message">
                Reset all checklist progress and set
                Minecraft Day back to Day 1 for
                "${escapeHTML(world.name)}"?
            </p>

            <div class="modal-actions">

                <button
                    type="button"
                    class="action-button"
                    id="resetCancel"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="action-button danger"
                    id="resetConfirm"
                >
                    Reset
                </button>

            </div>
            `;


        modalLayer.classList.add(
            "visible"
        );


        document
            .getElementById("resetCancel")
            .addEventListener(
                "click",
                closeModal
            );


        document
            .getElementById("resetConfirm")
            .addEventListener(
                "click",
                () => {

                    world.progress = {};

                    world.day = 1;


                    saveWorlds();

                    closeModal();

                    renderWorlds();
                    renderChecklist();
                    updateDayDisplay();

                    showMessage(
                        "World reset."
                    );
                }
            );
    }


    /*
        ------------------------------------------------------------
        MODAL HELPERS
        ------------------------------------------------------------
    */

    function closeModal() {

        modalLayer.classList.remove(
            "visible"
        );

        modal.innerHTML = "";
    }


    modalLayer.addEventListener(
        "click",
        event => {

            if (
                event.target ===
                modalLayer
            ) {

                closeModal();
            }
        }
    );


    /*
        ------------------------------------------------------------
        TOAST
        ------------------------------------------------------------
    */

    function showMessage(
        text
    ) {

        toast.textContent =
            text;


        toast.classList.add(
            "visible"
        );


        clearTimeout(
            toastTimer
        );


        toastTimer =
            setTimeout(
                () => {

                    toast.classList.remove(
                        "visible"
                    );

                },
                2200
            );
    }


    /*
        ------------------------------------------------------------
        ZOOM DISABLING
        ------------------------------------------------------------
    */

    document.addEventListener(
        "gesturestart",
        event => {
            event.preventDefault();
        },
        {
            passive: false
        }
    );


    document.addEventListener(
        "gesturechange",
        event => {
            event.preventDefault();
        },
        {
            passive: false
        }
    );


    document.addEventListener(
        "gestureend",
        event => {
            event.preventDefault();
        },
        {
            passive: false
        }
    );


    document.addEventListener(
        "wheel",
        event => {

            if (
                event.ctrlKey ||
                event.metaKey
            ) {

                event.preventDefault();
            }
        },
        {
            passive: false
        }
    );


    document.addEventListener(
        "keydown",
        event => {

            if (
                event.ctrlKey ||
                event.metaKey
            ) {

                if (
                    event.key === "+" ||
                    event.key === "-" ||
                    event.key === "=" ||
                    event.key === "0"
                ) {

                    event.preventDefault();
                }
            }
        }
    );


    /*
        ------------------------------------------------------------
        STARTUP
        ------------------------------------------------------------
    */

    loadWorlds();

    setupSearchPlaceholder(
        searchBox
    );

    setupSearchPlaceholder(
        worldSearchBox
    );

    renderWorlds();

    updateDayDisplay();

    loadChecklist(true);


    /*
        Keep checklist.json updated while the page is open.
        The incremental renderer preserves which sections are open.
    */

    setInterval(
        () => {
            loadChecklist(false);
        },
        CHECKLIST_POLL_INTERVAL
    );

</script>

</body>
</html>
