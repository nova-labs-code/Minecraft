<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="theme-color"
        content="#090b10"
    >

    <title>Versions</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            margin: 0;
            padding: 0;

            background: #090b10;

            touch-action: manipulation;
            -ms-touch-action: manipulation;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #151a2b 0,
                    #090b10 45%
                );

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;

            overscroll-behavior: none;

            touch-action: manipulation;
            -ms-touch-action: manipulation;
        }

        a,
        button,
        input,
        select,
        textarea {
            touch-action: manipulation;
            -ms-touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;
        }

        input {
            -webkit-user-select: text;
            user-select: text;
        }

        .page {
            width: 100%;
            min-height: 100vh;

            padding:
                64px 20px
                calc(
                    64px +
                    env(safe-area-inset-bottom)
                );
        }

        .container {
            width: 100%;
            max-width: 760px;

            margin: 0 auto;
        }

        .header {
            margin-bottom: 28px;
        }

        .eyebrow {
            margin-bottom: 9px;

            color: #818cf8;

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;

            font-size:
                clamp(
                    32px,
                    7vw,
                    46px
                );

            line-height: 1.05;

            letter-spacing: -0.04em;
        }

        .description {
            max-width: 560px;

            margin: 12px 0 0;

            color: #9da4b3;

            font-size: 15px;
            line-height: 1.55;
        }

        .latest {
            display: flex;

            align-items: center;
            justify-content: space-between;

            width: 100%;

            padding: 16px 18px;

            margin-bottom: 18px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #4338ca
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            border-radius: 12px;

            color: #ffffff;

            text-decoration: none;

            box-shadow:
                0 10px 28px
                rgba(
                    79,
                    70,
                    229,
                    0.18
                );

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .latest:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 34px
                rgba(
                    79,
                    70,
                    229,
                    0.28
                );
        }

        .latest:active {
            transform: scale(0.99);
        }

        .latest-label {
            display: block;

            margin-bottom: 2px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.7
                );

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .latest-version {
            display: block;

            font-size: 18px;
            font-weight: 700;
        }

        .toolbar {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;
        }

        .search {
            position: relative;

            flex: 1;
        }

        .search-icon {
            position: absolute;

            top: 50%;
            left: 13px;

            width: 16px;
            height: 16px;

            transform:
                translateY(-50%);

            color: #747d8f;

            pointer-events: none;
        }

        .search input {
            width: 100%;

            min-height: 44px;

            padding:
                0 14px
                0 40px;

            background: #11151d;

            border:
                1px solid
                #252c39;

            border-radius: 10px;

            outline: none;

            color: #ffffff;

            font-family: inherit;
            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .search input::placeholder {
            color: #687181;
        }

        .search input:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(
                    99,
                    102,
                    241,
                    0.12
                );
        }

        .count {
            flex-shrink: 0;

            color: #747d8f;

            font-size: 12px;
        }

        .versions {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(120px, 1fr)
                );

            gap: 8px;
        }

        .version {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 52px;

            padding:
                10px 12px;

            background:
                rgba(
                    17,
                    21,
                    29,
                    0.92
                );

            border:
                1px solid
                #202633;

            border-radius: 9px;

            color: #ffffff;

            text-decoration: none;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .version:hover {
            transform: translateY(-2px);

            background: #151a23;

            border-color: #4f46e5;
        }

        .version:active {
            transform: scale(0.98);
        }

        .version-number {
            font-size: 16px;
            font-weight: 700;
        }

        .empty {
            display: none;

            padding: 36px 20px;

            border:
                1px dashed
                #2a3140;

            border-radius: 12px;

            color: #7f8898;

            text-align: center;
        }

        .empty-title {
            margin-bottom: 5px;

            color: #c5cad3;

            font-size: 16px;
            font-weight: 600;
        }

        .empty-description {
            font-size: 13px;
        }

        @media (max-width: 600px) {

            .page {
                padding-top: 40px;
            }

            .latest {
                padding:
                    15px 16px;
            }

            .toolbar {
                align-items: stretch;

                flex-direction: column;
            }

            .count {
                padding-left: 2px;
            }

            .versions {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );
            }
        }

        @media (max-width: 380px) {

            .versions {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="container">

            <header class="header">

                <div class="eyebrow">
                    Version Directory
                </div>

                <h1>
                    Versions
                </h1>

                <p class="description">
                    Browse and access every available
                    version.
                </p>

            </header>


            <a
                id="latest"
                class="latest"
            >

                <span>

                    <span class="latest-label">
                        Latest Version
                    </span>

                    <span
                        id="latestVersion"
                        class="latest-version"
                    ></span>

                </span>

            </a>


            <div class="toolbar">

                <div class="search">

                    <svg
                        class="search-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        ></circle>

                        <path
                            d="m20 20-4-4"
                        ></path>

                    </svg>

                    <input
                        id="search"
                        type="search"
                        placeholder="Search versions..."
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        enterkeyhint="search"
                    >

                </div>

                <div
                    id="count"
                    class="count"
                ></div>

            </div>


            <section
                id="versions"
                class="versions"
                aria-label="Available versions"
            ></section>


            <div
                id="empty"
                class="empty"
            >

                <div class="empty-title">
                    No versions found
                </div>

                <div class="empty-description">
                    Try searching for another version.
                </div>

            </div>

        </div>

    </main>


    <script>

        /*
            Change ONLY this number.
        */

        const versionCount = 2;


        /*
            Latest version automatically
            uses the highest version number.
        */

        const latestVersion =
            versionCount;


        const latest =
            document.getElementById(
                "latest"
            );

        const latestVersionText =
            document.getElementById(
                "latestVersion"
            );

        const versions =
            document.getElementById(
                "versions"
            );

        const search =
            document.getElementById(
                "search"
            );

        const count =
            document.getElementById(
                "count"
            );

        const empty =
            document.getElementById(
                "empty"
            );


        /*
            Set latest version.
        */

        latest.href =
            "./v" +
            latestVersion;

        latestVersionText.textContent =
            "v" +
            latestVersion;


        /*
            Create all versions.
        */

        for (
            let version = 1;
            version <= versionCount;
            version++
        ) {

            const link =
                document.createElement(
                    "a"
                );

            link.className =
                "version";

            link.href =
                "./v" +
                version;

            link.dataset.version =
                String(version);


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "version-number";

            number.textContent =
                "v" +
                version;


            link.appendChild(
                number
            );

            versions.appendChild(
                link
            );
        }


        /*
            Search versions.
        */

        function filterVersions() {

            const query =
                search.value
                    .trim()
                    .toLowerCase()
                    .replace(
                        /^version\s*/,
                        ""
                    )
                    .replace(
                        /^v/,
                        ""
                    );


            const versionLinks =
                versions.querySelectorAll(
                    ".version"
                );


            let visibleCount = 0;


            versionLinks.forEach(
                function (link) {

                    const version =
                        link.dataset.version;


                    const matches =
                        query === "" ||
                        version.includes(
                            query
                        );


                    link.style.display =
                        matches
                            ? ""
                            : "none";


                    if (matches) {
                        visibleCount++;
                    }

                }
            );


            count.textContent =
                visibleCount +
                " of " +
                versionCount +
                " versions";


            empty.style.display =
                visibleCount === 0
                    ? "block"
                    : "none";
        }


        search.addEventListener(
            "input",
            filterVersions
        );


        /*
            Prevent browser gesture zoom.
        */

        document.addEventListener(
            "gesturestart",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gesturechange",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );

        document.addEventListener(
            "gestureend",
            function (event) {
                event.preventDefault();
            },
            {
                passive: false
            }
        );


        /*
            Prevent multi-touch pinch zoom.
        */

        document.addEventListener(
            "touchstart",
            function (event) {

                if (
                    event.touches.length > 1
                ) {
                    event.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        document.addEventListener(
            "touchmove",
            function (event) {

                if (
                    event.touches.length > 1
                ) {
                    event.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        /*
            Prevent double-tap zoom.
        */

        let lastTouchEnd = 0;

        document.addEventListener(
            "touchend",
            function (event) {

                const now =
                    Date.now();

                if (
                    now - lastTouchEnd <= 300
                ) {
                    event.preventDefault();
                }

                lastTouchEnd = now;

            },
            {
                passive: false
            }
        );


        /*
            Initial count.
        */

        filterVersions();

    </script>

</body>
</html>
